<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Contatos - Novari Print</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel" src="auth-gate.js"></script>
<style>
:root{
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --navy:#151F38; --red:#CE1B21; --blue:#66B2E5;
  --c-blue:#2E86C7; --c-sky:#2E9BD6; --c-green:#1E9E6A; --c-red:#CE1B21; --c-amber:#B4791A; --c-violet:#6D54C8;
  --side-bg:#151F38; --side-ink:#EEF2FB; --side-muted:#93A0C0;
  --side-active:rgba(206,27,33,.16); --side-hover:rgba(255,255,255,.06); --side-line:rgba(255,255,255,.09);
  --bg:#F3F4F7; --surface:#FFFFFF; --col:#EEF0F5; --hover:#F3F5F9;
  --ink:#111B33; --ink-2:#4B5673; --muted:#6B7690;
  --line:#E2E6EE; --line-strong:#CFD6E2;
  --brand:#151F38; --brand-ink:#FFFFFF; --accent:#2E86C7; --brand-red:#CE1B21; --brand-blue:#66B2E5;
  --alert:#B42318; --alert-bg:#FEF0EE; --warn:#A54A08; --warn-bg:#FDF3E7; --ok:#067647; --ok-bg:#E8F6EF;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --side-bg:#111A30;
  --bg:#0C1220; --surface:#151C2E; --col:#1A2238; --hover:#1C2540;
  --ink:#E8ECF5; --ink-2:#AEB8CE; --muted:#8B96AE;
  --line:#242D44; --line-strong:#34405C;
  --brand:#E8ECF5; --brand-ink:#0D1322; --accent:#66B2E5; --brand-red:#FF6B61; --brand-blue:#66B2E5;
  --alert:#FF8F80; --alert-bg:#331A18; --warn:#F2B25A; --warn-bg:#2E2212; --ok:#5BD29A; --ok-bg:#122A22;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --side-bg:#111A30;
  --bg:#0C1220; --surface:#151C2E; --col:#1A2238; --hover:#1C2540;
  --ink:#E8ECF5; --ink-2:#AEB8CE; --muted:#8B96AE;
  --line:#242D44; --line-strong:#34405C;
  --brand:#E8ECF5; --brand-ink:#0D1322; --accent:#66B2E5; --brand-red:#FF6B61; --brand-blue:#66B2E5;
  --alert:#FF8F80; --alert-bg:#331A18; --warn:#F2B25A; --warn-bg:#2E2212; --ok:#5BD29A; --ok-bg:#122A22;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--line);border-top:3px solid var(--brand-red)}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;background:none;border:0;padding:0}
.logo-img{height:38px;width:auto;display:block}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.2;color:var(--ink);text-align:left}
.brand-sub{color:var(--muted);font-size:12.5px;text-align:left}

.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink-2);font-size:13px;font-weight:500;cursor:pointer;padding:0;margin-bottom:10px}
.back:hover{color:var(--ink)}
.page-h{margin:0 0 20px}
.page-h h1{margin:0 0 4px;font-size:20px;font-weight:700;letter-spacing:-.01em}
.page-h p{margin:0;color:var(--muted);font-size:13px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);color:var(--ink);font-weight:500;font-size:13.5px;cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.danger{color:var(--alert);border-color:var(--alert)}
.btn.danger:hover{background:var(--alert-bg)}
.btn.sm{height:30px;font-size:12px;padding:0 10px}
.btn[disabled]{opacity:.5;cursor:default}

/* Summary */
.summary-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.summary-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.summary-card .label{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.summary-card .value{font-size:22px;font-weight:700;letter-spacing:-.02em}
.summary-card .sub{font-size:12px;color:var(--muted);margin-top:4px}

/* Top bar */
.c-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:20px}

/* Search & filters */
.tools{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:0 12px}
.search input{flex:1;border:0;background:none;height:40px;font-size:14px;color:var(--ink);outline:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--line-strong);border-radius:20px;background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:500;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip b{font-weight:700}

/* Contact list */
.clist{display:flex;flex-direction:column;gap:8px}
.ccard{display:block;width:100%;text-align:left;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font:inherit;color:inherit}
.ccard:hover{border-color:var(--line-strong)}
.c-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.c-h h4{margin:0;font-size:14.5px;font-weight:600}
.tag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.tag.orgao{background:#EAF5FC;color:#1D6FA5}
.tag.privada{background:#F0FDF4;color:#166534}
@media (prefers-color-scheme:dark){
  .tag.orgao{background:#172544;color:#93C5FD}
  .tag.privada{background:#183A28;color:#5BD29A}
}
.meta{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:5px}

/* Dialog */
.ov{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(9,14,28,.55)}
.dlg{width:520px;max-width:100%;max-height:92vh;overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px 10px}
.dlg-h h2{margin:0;font-size:16px;font-weight:700}
.dlg-b{padding:6px 22px 18px}
.dlg-f{display:flex;gap:8px;justify-content:space-between;padding:14px 22px;border-top:1px solid var(--line)}
.dlg-f .right{display:flex;gap:8px}
.x{width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:6px;background:none;color:var(--muted);cursor:pointer;flex:none}
.x:hover{background:var(--hover);color:var(--ink)}
.form{display:grid;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label{display:block;margin-bottom:5px;font-weight:600;font-size:12.5px;color:var(--ink-2)}
.inp{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink);font-size:14px}
.inp:focus{border-color:var(--accent);outline:none}
select.inp{appearance:auto}
.seg{display:flex;gap:0}
.seg button{flex:1;padding:8px 12px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:500;cursor:pointer}
.seg button:first-child{border-radius:6px 0 0 6px}
.seg button:last-child{border-radius:0 6px 6px 0}
.seg button+button{border-left:0}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.err{color:var(--alert);font-size:12.5px;margin:-4px 0 0}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.loading{color:var(--muted);padding:30px 0;text-align:center}

@media (max-width:820px){.row2{grid-template-columns:1fr}}
@media (max-width:600px){.summary-row{grid-template-columns:1fr 1fr}}

/* ===== Casca padrão Novari (sidebar + topbar) ===== */
.side{position:fixed;left:0;top:0;bottom:0;width:238px;z-index:30;background:var(--side-bg);color:var(--side-ink);
  display:flex;flex-direction:column;gap:4px;padding:16px 12px calc(16px + env(safe-area-inset-bottom,0px));
  border-right:1px solid var(--side-line);overflow-y:auto}
.side-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;text-decoration:none}
.side-brand img{height:34px;width:auto;display:block;background:#fff;border-radius:8px;padding:3px}
.side-brand .nm{font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.15;color:var(--side-ink)}
.side-brand .sb{font-size:11.5px;color:var(--side-muted);letter-spacing:.03em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .lab{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);padding:12px 10px 4px}
.navi{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--side-ink);
  text-decoration:none;font-size:13.5px;font-weight:500;position:relative;opacity:.86;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.navi:hover{background:var(--side-hover);opacity:1}
.navi.active{background:var(--side-active);opacity:1;font-weight:600}
.navi.active::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--red)}
.navi.soon{opacity:.5;cursor:default}.navi.soon:hover{background:none}
.navi .ic{width:17px;height:17px;opacity:.95}
body{padding-left:238px}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--surface);
  border-bottom:1px solid var(--line);border-top:3px solid var(--red);position:sticky;top:0;z-index:10;
  padding-top:calc(12px + env(safe-area-inset-top,0px))}
.tb-search{flex:1;min-width:0;max-width:440px;display:flex;align-items:center;gap:9px;background:var(--col);
  border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted)}
.tb-search input{border:0;background:transparent;color:var(--ink);font-size:13.5px;width:100%;outline:none}
.tb-search input::placeholder{color:var(--muted)}
.tb-search .ic{width:16px;height:16px}
.tb-sp{flex:1}
.ib{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;color:var(--ink-2);background:transparent;border:1px solid transparent;cursor:pointer;position:relative}
.ib:hover{background:var(--hover);border-color:var(--line)}
.ib .ic{width:18px;height:18px}
.ib .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid var(--surface)}
.tb-user{display:flex;align-items:center;gap:10px;padding-left:2px}
.tb-ava{width:38px;height:38px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.tb-user .un{font-weight:600;font-size:13.5px;line-height:1.15}
.tb-user .ur{font-size:11.5px;color:var(--muted)}
.theme-moon,.theme-sun{display:none}
:root:not([data-theme]) .theme-moon{display:block}
@media (prefers-color-scheme:dark){ :root:not([data-theme]) .theme-moon{display:none} :root:not([data-theme]) .theme-sun{display:block} }
:root[data-theme="light"] .theme-moon{display:block}
:root[data-theme="dark"] .theme-sun{display:block}
.back{display:none!important}
@media (max-width:820px){
  body{padding-left:0}
  .side{position:static;width:auto;flex-direction:row;align-items:center;gap:8px;overflow-x:auto;padding:10px 12px;border-right:0;border-bottom:1px solid var(--side-line)}
  .side-brand{padding:0 8px 0 2px;border-right:1px solid var(--side-line);margin-right:4px}
  .side-brand .sb{display:none}
  .nav{flex-direction:row;gap:4px}
  .nav .lab{display:none}
  .navi{white-space:nowrap;padding:8px 11px;width:auto}
  .navi.active::before{display:none}
  .navi.active{box-shadow:inset 0 -2px 0 var(--red)}
}
@media (max-width:520px){ .topbar{flex-wrap:wrap} .tb-search{order:3;max-width:none;flex-basis:100%} .tb-user .un,.tb-user .ur{display:none} }

</style>
</head>

  {key:'index', nome:'Painel', icon:'grid', href:'index.html'},
  {key:'contatos', nome:'Contatos', icon:'users', href:'contatos.html'},
  {key:'pedidos', nome:'Pedidos', icon:'package', href:'pedidos.html'},
  {key:'financeiro', nome:'Financeiro', icon:'wallet', href:'financeiro.html'},
  {key:'administrativo', nome:'Administrativo', icon:'building', href:'administrativo.html'},
  {key:'estoque', nome:'Estoque', icon:'box', href:'estoque.html'},
  {key:'licitacao', nome:'Licitação', icon:'gavel', href:'licitacao.html'},
];
function Sidebar() {
  return (
    <aside className="side">
      <a href={PAINEL_URL} className="side-brand">
        <img src="novari-icon.png" alt="Novari Print" />
        <div><div className="nm">Novari Print</div><div className="sb">Gestão</div></div>
      </a>
      <nav className="nav">
        {NAV_ITEMS.map(n => (
          <a key={n.key} className={"navi" + (n.key===ACTIVE ? " active" : "")}
             href={n.href} target={n.ext ? "_blank" : undefined} rel={n.ext ? "noopener" : undefined}>
            <Icon name={n.icon} />{n.nome}
          </a>
        ))}
        <div className="lab">Sistema</div>
        <span className="navi soon"><Icon name="chart" />Relatórios</span>
        <span className="navi soon"><Icon name="settings" />Configurações</span>
      </nav>
    </aside>
  );
}
function toggleTheme(){
  const r = document.documentElement;
  let cur = r.getAttribute('data-theme');
  if(!cur) cur = (window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches) ? 'dark' : 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  r.setAttribute('data-theme', next);
  try{ localStorage.setItem('novari-theme', next); }catch(e){}
}
function Topbar() {
  return (
    <header className="topbar">
      <div className="tb-search"><Icon name="search" /><input placeholder="Buscar…" aria-label="Buscar" /></div>
      <div className="tb-sp"></div>
      <button className="ib" onClick={toggleTheme} aria-label="Tema claro/escuro">
        <svg className="ic theme-moon" viewBox="0 0 24 24"><use href="#i-moon"/></svg>
        <svg className="ic theme-sun" viewBox="0 0 24 24"><use href="#i-sun"/></svg>
      </button>
      <button className="ib" aria-label="Notificações"><Icon name="bell" /><span className="dot"></span></button>
      <button className="ib" aria-label="Ajuda"><Icon name="help" /></button>
      <div className="tb-user">
        <div className="tb-ava">NM</div>
        <div><div className="un">Nicolas Monte</div><div className="ur">Administrador</div></div>
      </div>
    </header>
  );
}
function Header() {
  return (<React.Fragment><Sidebar /><Topbar /></React.Fragment>);
}

/* ── Dialog (padrão) ─────────────────────── */
function Dialog({title, onClose, onSave, onDelete, saving, err, children}) {
  return (
    <div className="ov" onClick={e => {if(e.target===e.currentTarget) onClose();}}>
      <div className="dlg" role="dialog" aria-modal="true">
        <div className="dlg-h">
          <h2>{title}</h2>
          <button className="x" onClick={onClose}><Icon name="x"/></button>
        </div>
        <div className="dlg-b">
          {children}
          {err && <p className="err">{err}</p>}
        </div>
        <div className="dlg-f">
          <div>{onDelete && <button className="btn danger" onClick={onDelete} disabled={saving}><Icon name="trash"/> Excluir</button>}</div>
          <div className="right">
            <button className="btn" onClick={onClose}>Cancelar</button>
            <button className="btn primary" onClick={onSave} disabled={saving}>{saving ? 'Salvando…' : 'Salvar'}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── useCollection hook ──────────────────── */
function useCollection(name) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    if (!db) return;
    const unsub = db.collection(name).onSnapshot(snap => {
      setItems(snap.docs.map(d => ({id:d.id, ...d.data()})));
      setLoading(false);
    }, () => setLoading(false));
    return unsub;
  }, [name]);
  return {items, loading};
}

/* ── Contato Form ────────────────────────── */
const emptyForm = {tipo:'privada', nome:'', cnpj:'', telefone:'', email:'', cidade:'', observacoes:''};

function ContatoDialog({initial, onClose, onSaved}) {
  const isEdit = !!(initial && initial.id);
  const [form, setForm] = useState(initial ? {...emptyForm, ...initial} : emptyForm);
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');

  function set(k, v) { setForm(f => ({...f, [k]: v})); }

  async function save() {
    if (!form.nome.trim()) { setErr('Informe o nome ou razão social.'); return; }
    setErr(''); setSaving(true);
    try {
      const data = {
        tipo: form.tipo, nome: form.nome.trim(), cnpj: form.cnpj.trim(),
        telefone: form.telefone.trim(), email: form.email.trim(),
        cidade: form.cidade.trim(), observacoes: form.observacoes.trim(),
      };
      if (isEdit) {
        await db.collection('contatos').doc(initial.id).update(data);
      } else {
        data.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
        await db.collection('contatos').add(data);
      }
      onSaved();
    } catch(e) {
      console.error(e);
      setErr('Não foi possível salvar. Tente novamente.');
    } finally {
      setSaving(false);
    }
  }

  async function remove() {
    if (!window.confirm('Excluir este contato? Essa ação não pode ser desfeita.')) return;
    setSaving(true);
    try {
      await db.collection('contatos').doc(initial.id).delete();
      onSaved();
    } catch(e) {
      console.error(e);
      setErr('Não foi possível excluir. Tente novamente.');
      setSaving(false);
    }
  }

  return (
    <Dialog
      title={isEdit ? 'Editar contato' : 'Novo contato'}
      onClose={onClose}
      onSave={save}
      onDelete={isEdit ? remove : null}
      saving={saving}
      err={err}
    >
      <div className="form">
        <div className="f">
          <label>Tipo</label>
          <div className="seg">
            <button type="button" aria-pressed={form.tipo==='privada'} onClick={() => set('tipo','privada')}>Empresa privada</button>
            <button type="button" aria-pressed={form.tipo==='orgao'} onClick={() => set('tipo','orgao')}>Órgão público</button>
          </div>
        </div>
        <div className="f"><label>Nome / Razão social *</label><input className="inp" value={form.nome} onChange={e=>set('nome',e.target.value)} placeholder="Nome do cliente ou órgão" /></div>
        <div className="row2">
          <div className="f"><label>CNPJ</label><input className="inp" value={form.cnpj} onChange={e=>set('cnpj',e.target.value)} placeholder="00.000.000/0000-00" /></div>
          <div className="f"><label>Telefone</label><input className="inp" value={form.telefone} onChange={e=>set('telefone',e.target.value)} placeholder="(92) 00000-0000" /></div>
        </div>
        <div className="f"><label>E-mail</label><input className="inp" value={form.email} onChange={e=>set('email',e.target.value)} placeholder="contato@empresa.com" /></div>
        <div className="f"><label>Cidade / UF</label><input className="inp" value={form.cidade} onChange={e=>set('cidade',e.target.value)} placeholder="Manaus / AM" /></div>
        <div className="f"><label>Observações</label><textarea className="inp" rows="2" value={form.observacoes} onChange={e=>set('observacoes',e.target.value)} placeholder="Anotações sobre este contato"></textarea></div>
      </div>
    </Dialog>
  );
}

/* ── App ─────────────────────────────────── */
function App() {
  const {items: contatos, loading} = useCollection('contatos');
  const [filtro, setFiltro] = useState('todos');
  const [busca, setBusca] = useState('');
  const [editing, setEditing] = useState(null);

  const sorted = useMemo(() =>
    [...contatos].sort((a,b) => (a.nome||'').localeCompare(b.nome||''))
  , [contatos]);

  const counts = useMemo(() => ({
    todos: sorted.length,
    orgao: sorted.filter(c=>c.tipo==='orgao').length,
    privada: sorted.filter(c=>c.tipo==='privada').length,
  }), [sorted]);

  const list = useMemo(() => {
    const q = busca.trim().toLowerCase();
    return sorted.filter(c =>
      (filtro==='todos' || c.tipo===filtro) &&
      (!q || (c.nome||'').toLowerCase().includes(q) || (c.cidade||'').toLowerCase().includes(q) || (c.cnpj||'').includes(q) || (c.email||'').toLowerCase().includes(q))
    );
  }, [sorted, filtro, busca]);

  return (
    <React.Fragment>
      <Header />
      <main className="wrap">
        <a href={PAINEL_URL} className="back"><Icon name="back"/>Painel</a>

        <div className="c-top">
          <div className="page-h" style={{margin:0}}>
            <h1>Contatos</h1>
            <p>Clientes, fornecedores e órgãos públicos.</p>
          </div>
          <button className="btn primary" onClick={() => setEditing({})}><Icon name="plus"/>Novo contato</button>
        </div>

        {/* Summary cards */}
        <div className="summary-row">
          <div className="summary-card">
            <div className="label">Total de contatos</div>
            <div className="value">{counts.todos}</div>
          </div>
          <div className="summary-card">
            <div className="label">Órgãos públicos</div>
            <div className="value">{counts.orgao}</div>
          </div>
          <div className="summary-card">
            <div className="label">Empresas privadas</div>
            <div className="value">{counts.privada}</div>
          </div>
        </div>

        {/* Search & filters */}
        <div className="tools">
          <div className="search">
            <Icon name="search" />
            <input placeholder="Buscar por nome, CNPJ, cidade ou e-mail" value={busca} onChange={e=>setBusca(e.target.value)} />
          </div>
          <div className="chips">
            <button className="chip" aria-pressed={filtro==='todos'} onClick={()=>setFiltro('todos')}>Todos <b>{counts.todos}</b></button>
            <button className="chip" aria-pressed={filtro==='orgao'} onClick={()=>setFiltro('orgao')}>Órgãos públicos <b>{counts.orgao}</b></button>
            <button className="chip" aria-pressed={filtro==='privada'} onClick={()=>setFiltro('privada')}>Empresas privadas <b>{counts.privada}</b></button>
          </div>
        </div>

        {loading && <p className="loading">Carregando contatos…</p>}
        {!loading && list.length === 0 && <p className="empty">Nenhum contato encontrado.</p>}
        {!loading && list.length > 0 && (
          <div className="clist">
            {list.map(c => (
              <button key={c.id} className="ccard" onClick={() => setEditing(c)}>
                <div className="c-h">
                  <h4>{c.nome}</h4>
                  <span className={"tag " + c.tipo}>{c.tipo==='orgao' ? 'Órgão público' : 'Empresa privada'}</span>
                </div>
                <div className="meta">
                  {c.cnpj && <span><Icon name="building" />{c.cnpj}</span>}
                  {c.telefone && <span><Icon name="phone" />{c.telefone}</span>}
                  {c.email && <span><Icon name="mail" />{c.email}</span>}
                  {c.cidade && <span><Icon name="pin" />{c.cidade}</span>}
                </div>
              </button>
            ))}
          </div>
        )}

        {editing !== null && (
          <ContatoDialog
            initial={editing}
            onClose={() => setEditing(null)}
            onSaved={() => setEditing(null)}
          />
        )}
      </main>
    </React.Fragment>
  );
}

(function(){try{var t=localStorage.getItem('novari-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
ReactDOM.createRoot(document.getElementById('root')).render(<AuthGate><App /></AuthGate>);
</script>
</body>
</html>

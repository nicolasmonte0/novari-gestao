<style>

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--line);border-top:3px solid var(--brand-red)}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;background:none;border:0;padding:0}
.logo-img{height:38px;width:auto;display:block}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.2;color:var(--ink);text-align:left}
.brand-sub{color:var(--muted);font-size:12.5px;text-align:left}

.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink-2);font-size:13px;font-weight:500;cursor:pointer;padding:0;margin-bottom:10px}
.back:hover{color:var(--ink)}
.page-h{margin:0 0 20px}
.page-h h1{margin:0 0 4px;font-size:20px;font-weight:700;letter-spacing:-.01em}
.page-h p{margin:0;color:var(--muted);font-size:13px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);color:var(--ink);font-weight:500;font-size:13.5px;cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.danger{color:var(--alert);border-color:var(--alert)}
.btn.danger:hover{background:var(--alert-bg)}
.btn.sm{height:30px;font-size:12px;padding:0 10px}
.btn[disabled]{opacity:.5;cursor:default}

/* Top bar */
.c-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.total-line{margin:14px 0 18px;font-size:13px;color:var(--muted)}
.total-line b{color:var(--ink);font-weight:700}

/* Cards clicáveis de tipo de cliente */
.vgrid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:22px}
.vcard{position:relative;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:20px;cursor:pointer;font:inherit;color:inherit}
.vcard:hover{border-color:var(--line-strong)}
.vcard.on{border-color:var(--vc)}
.vcard .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.vcard .chip{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--vbg);color:var(--vc)}
.vcard .chip .ic{width:23px;height:23px}
.vcard .count{font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.vcard h3{margin:0 0 3px;font-size:15px;font-weight:600;color:var(--ink)}
.vcard .sub{font-size:13px;color:var(--muted)}
.vcard.orgao{--vc:#1D6FA5;--vbg:#EAF5FC}
.vcard.privada{--vc:#166534;--vbg:#F0FDF4}
@media (max-width:620px){ .vgrid2{grid-template-columns:1fr} }

/* Search & filters */
.tools{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:0 12px}
.search input{flex:1;border:0;background:none;height:40px;font-size:14px;color:var(--ink);outline:none}
.clear{font-size:12.5px;color:var(--accent);font-weight:600;cursor:pointer;background:none;border:0;padding:0}

/* Contact list */
.clist{display:flex;flex-direction:column;gap:8px}
.ccard{display:block;width:100%;text-align:left;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font:inherit;color:inherit}
.ccard:hover{border-color:var(--line-strong)}
.c-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.c-h h4{margin:0;font-size:14.5px;font-weight:600}
.tag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.tag.orgao{background:#EAF5FC;color:#1D6FA5}
.tag.privada{background:#F0FDF4;color:#166534}
@media (prefers-color-scheme:dark){
  .tag.orgao{background:#172544;color:#93C5FD}
  .tag.privada{background:#183A28;color:#5BD29A}
}
.meta{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:5px}

/* Dialog */
.ov{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(9,14,28,.55)}
.dlg{width:520px;max-width:100%;max-height:92vh;overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px 10px}
.dlg-h h2{margin:0;font-size:16px;font-weight:700}
.dlg-b{padding:6px 22px 18px}
.dlg-f{display:flex;gap:8px;justify-content:space-between;padding:14px 22px;border-top:1px solid var(--line)}
.dlg-f .right{display:flex;gap:8px}
.x{width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:6px;background:none;color:var(--muted);cursor:pointer;flex:none}
.x:hover{background:var(--hover);color:var(--ink)}
.form{display:grid;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label{display:block;margin-bottom:5px;font-weight:600;font-size:12.5px;color:var(--ink-2)}
.inp{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink);font-size:14px}
.inp:focus{border-color:var(--accent);outline:none}
select.inp{appearance:auto}
.seg{display:flex;gap:0}
.seg button{flex:1;padding:8px 12px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:500;cursor:pointer}
.seg button:first-child{border-radius:6px 0 0 6px}
.seg button:last-child{border-radius:0 6px 6px 0}
.seg button+button{border-left:0}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.err{color:var(--alert);font-size:12.5px;margin:-4px 0 0}
.hint-e{color:var(--alert);font-size:12px;margin:5px 0 0;font-weight:600}
.hint-w{background:var(--warn-bg);color:var(--warn);font-size:12.5px;line-height:1.45;border-radius:8px;padding:9px 12px;font-weight:500}
.hint-w b{font-weight:700}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.loading{color:var(--muted);padding:30px 0;text-align:center}

@media (max-width:820px){.row2{grid-template-columns:1fr}}

.back{display:none!important}

</style>

<script type="text/babel">
const {useState, useEffect, useMemo} = React;

/* ---------- Lixeira: excluir vira "mover para a lixeira" (reversível) ---------- */
function lixeiraCampos(){
  return {excluido:true, excluidoEm: firebase.firestore.FieldValue.serverTimestamp(), excluidoPor: ((firebase.auth().currentUser || {}).email) || ''};
}
function confirmarLixeira(oque, extra){
  return new Promise(resolve => {
    const bg = document.createElement('div');
    bg.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(10,16,32,.45);display:flex;align-items:center;justify-content:center;padding:16px';
    const box = document.createElement('div');
    box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true');
    box.style.cssText = 'width:400px;max-width:100%;background:var(--surface,#fff);color:var(--ink,#111B33);border:1px solid var(--line,#E2E6EE);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:20px 22px;font:14px/1.45 Inter,system-ui,sans-serif';
    const h = document.createElement('h3'); h.textContent = 'Mover para a lixeira?'; h.style.cssText = 'margin:0 0 6px;font-size:16px';
    const p = document.createElement('p'); p.style.cssText = 'margin:0 0 16px;font-size:13.5px;color:var(--ink-2,#4B5673)';
    p.textContent = oque + ' sai da lista, mas fica na Lixeira e pode ser restaurado quando quiser.' + (extra ? ' ' + extra : '');
    const f = document.createElement('div'); f.style.cssText = 'display:flex;justify-content:flex-end;gap:8px';
    const bc = document.createElement('button'); bc.type = 'button'; bc.textContent = 'Cancelar';
    bc.style.cssText = 'height:36px;padding:0 14px;border:1px solid var(--line-strong,#CFD6E2);border-radius:7px;background:var(--surface,#fff);color:var(--ink,#111B33);font:inherit;cursor:pointer';
    const bo = document.createElement('button'); bo.type = 'button'; bo.textContent = 'Mover para a lixeira';
    bo.style.cssText = 'height:36px;padding:0 14px;border:1px solid #B42318;border-radius:7px;background:#B42318;color:#fff;font:inherit;font-weight:600;cursor:pointer';
    function fim(v){ document.removeEventListener('keydown', tecla, true); bg.remove(); resolve(v); }
    function tecla(e){ if (e.key === 'Escape') { e.stopPropagation(); fim(false); } }
    bc.onclick = () => fim(false); bo.onclick = () => fim(true);
    bg.onclick = e => { if (e.target === bg) fim(false); };
    document.addEventListener('keydown', tecla, true);
    f.appendChild(bc); f.appendChild(bo); box.appendChild(h); box.appendChild(p); box.appendChild(f); bg.appendChild(box);
    document.body.appendChild(bg); bc.focus();
  });
}

const PAINEL_URL = "./";

function Icon({name, className}) {
  return <svg className={className || "ic"} viewBox="0 0 24 24"><use href={"#i-" + name} /></svg>;
}

/* ── Header (padrão) ─────────────────────── */
const ACTIVE = "contatos";
const NAV_ITEMS = [
  {key:'index', nome:'Painel', icon:'grid', href:'index.html'},
  {key:'contatos', nome:'Clientes', icon:'users', href:'contatos.html'},
  {key:'vendas', nome:'Vendas', icon:'trending', href:'vendas.html'},
  {key:'pedidos', nome:'Pedidos', icon:'package', href:'pedidos.html'},
  {key:'financeiro', nome:'Financeiro', icon:'wallet', href:'financeiro.html'},
  {key:'administrativo', nome:'Administrativo', icon:'building', href:'administrativo.html'},
  {key:'estoque', nome:'Estoque', icon:'box', href:'estoque.html'},
  {key:'licitacao', nome:'Licitação', icon:'gavel', href:'licitacao.html'},
];
function Sidebar() {
  return (
    <aside className="side">
      <a href={PAINEL_URL} className="side-brand">
        <img src="novari-icon.png" alt="Novari Print" />
        <div><div className="nm">Novari Print</div><div className="sb">Gestão</div></div>
      </a>
      <nav className="nav">
        {NAV_ITEMS.map(n => (
          <a key={n.key} className={"navi" + (n.key===ACTIVE ? " active" : "")}
             href={n.href} target={n.ext ? "_blank" : undefined} rel={n.ext ? "noopener" : undefined}>
            <Icon name={n.icon} />{n.nome}
          </a>
        ))}
        <div className="lab">Sistema</div>
        <a className={"navi" + (ACTIVE==="lixeira" ? " active" : "")} href="lixeira.html"><Icon name="trash" />Lixeira</a>
        <span className="navi soon"><Icon name="chart" />Relatórios</span>
        <span className="navi soon"><Icon name="settings" />Configurações</span>
      </nav>
    </aside>
  );
}
function toggleTheme(){
  const r = document.documentElement;
  let cur = r.getAttribute('data-theme');
  if(!cur) cur = (window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches) ? 'dark' : 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  r.setAttribute('data-theme', next);
  try{ localStorage.setItem('novari-theme', next); }catch(e){}
}
function Topbar() {
  return (
    <header className="topbar">
      <div className="tb-search"><Icon name="search" /><input placeholder="Buscar…" aria-label="Buscar" /></div>
      <div className="tb-sp"></div>
      <button className="ib" onClick={toggleTheme} aria-label="Tema claro/escuro">
        <svg className="ic theme-moon" viewBox="0 0 24 24"><use href="#i-moon"/></svg>
        <svg className="ic theme-sun" viewBox="0 0 24 24"><use href="#i-sun"/></svg>
      </button>
      <button className="ib" onClick={() => firebase.auth().signOut()} aria-label="Sair" title="Sair"><Icon name="logout" /></button>
      <button className="ib" aria-label="Notificações"><Icon name="bell" /><span className="dot"></span></button>
      <button className="ib" aria-label="Ajuda"><Icon name="help" /></button>
      <div className="tb-user">
        <div className="tb-ava">NM</div>
        <div><div className="un">Nicolas Monte</div><div className="ur">Administrador</div></div>
      </div>
    </header>
  );
}
function Header() {
  return (<React.Fragment><Sidebar /><Topbar /></React.Fragment>);
}

/* ── Dialog (padrão) ─────────────────────── */
function Dialog({title, onClose, onSave, onDelete, saving, err, children}) {
  return (
    <div className="ov" onClick={e => {if(e.target===e.currentTarget) onClose();}}>
      <div className="dlg" role="dialog" aria-modal="true">
        <div className="dlg-h">
          <h2>{title}</h2>
          <button className="x" onClick={onClose}><Icon name="x"/></button>
        </div>
        <div className="dlg-b">
          {children}
          {err && <p className="err">{err}</p>}
        </div>
        <div className="dlg-f">
          <div>{onDelete && <button className="btn danger" onClick={onDelete} disabled={saving}><Icon name="trash"/> Excluir</button>}</div>
          <div className="right">
            <button className="btn" onClick={onClose}>Cancelar</button>
            <button className="btn primary" onClick={onSave} disabled={saving}>{saving ? 'Salvando…' : 'Salvar'}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── useCollection hook ──────────────────── */
function useCollection(name) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    if (!db) return;
    const unsub = db.collection(name).onSnapshot(snap => {
      setItems(snap.docs.map(d => ({id:d.id, ...d.data()})).filter(x => !x.excluido));
      setLoading(false);
    }, err => { setLoading(false); if (window.novariErroLeitura) window.novariErroLeitura(name, err); });
    return unsub;
  }, [name]);
  return {items, loading};
}

/* ── Contato Form ────────────────────────── */
const emptyForm = {tipo:'privada', nome:'', cnpj:'', telefone:'', email:'', cidade:'', observacoes:''};

/* ── CNPJ/CPF e duplicados ──────────────── */
function soDigitos(s) { return String(s || '').replace(/\D/g, ''); }
function cpfValido(d) {
  if (d.length !== 11 || /^(\d)\1+$/.test(d)) return false;
  for (let t = 9; t < 11; t++) {
    let soma = 0;
    for (let i = 0; i < t; i++) soma += Number(d[i]) * (t + 1 - i);
    if (((soma * 10) % 11) % 10 !== Number(d[t])) return false;
  }
  return true;
}
function cnpjValido(d) {
  if (d.length !== 14 || /^(\d)\1+$/.test(d)) return false;
  for (let t = 12; t < 14; t++) {
    const pesos = t === 12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2];
    let soma = 0;
    for (let i = 0; i < t; i++) soma += Number(d[i]) * pesos[i];
    const r = soma % 11;
    if ((r < 2 ? 0 : 11 - r) !== Number(d[t])) return false;
  }
  return true;
}
function formatarDoc(d) {
  if (d.length === 11) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
  if (d.length === 14) return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
  return d;
}
/* ok=false => documento inválido; vazio=true => campo em branco (permitido) */
function docInfo(txt) {
  const d = soDigitos(txt);
  if (!d) return {vazio: true, ok: true, d};
  if (d.length === 11) return {ok: cpfValido(d), d, tipo: 'CPF'};
  if (d.length === 14) return {ok: cnpjValido(d), d, tipo: 'CNPJ'};
  return {ok: false, d, tipo: 'CNPJ/CPF', incompleto: true};
}
function normNome(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
}

function ContatoDialog({initial, onClose, onSaved, contatos}) {
  const isEdit = !!(initial && initial.id);
  const [form, setForm] = useState(initial ? {...emptyForm, ...initial} : emptyForm);
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');
  const [dupOk, setDupOk] = useState(false);

  function set(k, v) { setForm(f => ({...f, [k]: v})); if (k === 'nome' || k === 'cnpj') setDupOk(false); }

  const doc = docInfo(form.cnpj);
  const docMudou = soDigitos(form.cnpj) !== soDigitos(initial && initial.cnpj);
  const nomeNorm = normNome(form.nome);
  const duplicados = (contatos || []).filter(c => {
    if (initial && c.id === initial.id) return false;
    const mesmoDoc = !!doc.d && doc.ok && soDigitos(c.cnpj) === doc.d;
    const mesmoNome = !!nomeNorm && normNome(c.nome) === nomeNorm;
    return mesmoDoc || mesmoNome;
  });

  async function save() {
    if (!form.nome.trim()) { setErr('Informe o nome ou razão social.'); return; }
    if (!doc.vazio && !doc.ok && docMudou) {
      setErr(doc.incompleto ? 'Digite 11 dígitos (CPF) ou 14 dígitos (CNPJ), ou deixe o campo em branco.' : (doc.tipo + ' inválido. Confira os dígitos.'));
      return;
    }
    if (duplicados.length > 0 && !dupOk) {
      setDupOk(true);
      setErr('Já existe cadastro parecido (veja o aviso acima). Se é outro cliente mesmo, clique em Salvar de novo.');
      return;
    }
    setErr(''); setSaving(true);
    try {
      const data = {
        tipo: form.tipo, nome: form.nome.trim(), cnpj: (doc.ok && doc.d) ? formatarDoc(doc.d) : form.cnpj.trim(),
        telefone: form.telefone.trim(), email: form.email.trim(),
        cidade: form.cidade.trim(), observacoes: form.observacoes.trim(),
      };
      if (isEdit) {
        await db.collection('contatos').doc(initial.id).update(data);
      } else {
        data.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
        await db.collection('contatos').add(data);
      }
      onSaved();
    } catch(e) {
      console.error(e);
      setErr('Não foi possível salvar. Tente novamente.');
    } finally {
      setSaving(false);
    }
  }

  async function remove() {
    if (!(await confirmarLixeira('Este contato'))) return;
    setSaving(true);
    try {
      await db.collection('contatos').doc(initial.id).update(lixeiraCampos());
      onSaved();
    } catch(e) {
      console.error(e);
      setErr('Não foi possível excluir. Tente novamente.');
      setSaving(false);
    }
  }

  return (
    <Dialog
      title={isEdit ? 'Editar contato' : 'Novo contato'}
      onClose={onClose}
      onSave={save}
      onDelete={isEdit ? remove : null}
      saving={saving}
      err={err}
    >
      <div className="form">
        <div className="f">
          <label>Tipo</label>
          <div className="seg">
            <button type="button" aria-pressed={form.tipo==='privada'} onClick={() => set('tipo','privada')}>Empresa privada</button>
            <button type="button" aria-pressed={form.tipo==='orgao'} onClick={() => set('tipo','orgao')}>Órgão público</button>
          </div>
        </div>
        <div className="f"><label>Nome / Razão social *</label><input className="inp" value={form.nome} onChange={e=>set('nome',e.target.value)} placeholder="Nome do cliente ou órgão" /></div>
        <div className="row2">
          <div className="f"><label>CNPJ / CPF</label><input className="inp" value={form.cnpj} onChange={e=>set('cnpj',e.target.value)} placeholder="00.000.000/0000-00" inputMode="numeric" />
            {!doc.vazio && !doc.ok && <p className="hint-e">{doc.incompleto ? 'Faltam dígitos: CPF tem 11 e CNPJ tem 14.' : (doc.tipo + ' inválido: confira os dígitos.')}</p>}
          </div>
          <div className="f"><label>Telefone</label><input className="inp" value={form.telefone} onChange={e=>set('telefone',e.target.value)} placeholder="(92) 00000-0000" /></div>
        </div>
        {duplicados.length > 0 && (
          <div className="hint-w">
            <b>Já existe cadastro parecido:</b> {duplicados.slice(0,3).map(c => c.nome).join(' · ')}{duplicados.length > 3 ? ' e mais ' + (duplicados.length - 3) : ''}. Confira antes de salvar para não duplicar o cliente.
          </div>
        )}
        <div className="f"><label>E-mail</label><input className="inp" value={form.email} onChange={e=>set('email',e.target.value)} placeholder="contato@empresa.com" /></div>
        <div className="f"><label>Cidade / UF</label><input className="inp" value={form.cidade} onChange={e=>set('cidade',e.target.value)} placeholder="Manaus / AM" /></div>
        <div className="f"><label>Observações</label><textarea className="inp" rows="2" value={form.observacoes} onChange={e=>set('observacoes',e.target.value)} placeholder="Anotações sobre este contato"></textarea></div>
      </div>
    </Dialog>
  );
}

/* ── App ─────────────────────────────────── */
function App() {
  const {items: contatos, loading} = useCollection('contatos');
  const [filtro, setFiltro] = useState('todos');
  const [busca, setBusca] = useState('');
  const [editing, setEditing] = useState(null);

  const sorted = useMemo(() =>
    [...contatos].sort((a,b) => (a.nome||'').localeCompare(b.nome||''))
  , [contatos]);

  const counts = useMemo(() => ({
    todos: sorted.length,
    orgao: sorted.filter(c=>c.tipo==='orgao').length,
    privada: sorted.filter(c=>c.tipo==='privada').length,
  }), [sorted]);

  const list = useMemo(() => {
    const q = busca.trim().toLowerCase();
    return sorted.filter(c =>
      (filtro==='todos' || c.tipo===filtro) &&
      (!q || (c.nome||'').toLowerCase().includes(q) || (c.cidade||'').toLowerCase().includes(q) || (c.cnpj||'').includes(q) || (c.email||'').toLowerCase().includes(q))
    );
  }, [sorted, filtro, busca]);

  return (
    <React.Fragment>
      <Header />
      <main className="wrap">
        <a href={PAINEL_URL} className="back"><Icon name="back"/>Painel</a>

        <div className="c-top">
          <div className="page-h" style={{margin:0}}>
            <h1>Clientes</h1>
            <p>Órgãos públicos e empresas privadas.</p>
          </div>
          <button className="btn primary" onClick={() => setEditing({})}><Icon name="plus"/>Novo contato</button>
        </div>

        {/* Cards clicáveis por tipo de cliente */}
        <div className="vgrid2">
          <button
            type="button"
            className={"vcard orgao" + (filtro === 'orgao' ? " on" : "")}
            onClick={() => setFiltro(filtro === 'orgao' ? 'todos' : 'orgao')}
            aria-pressed={filtro === 'orgao'}
          >
            <div className="top">
              <span className="chip"><Icon name="building" /></span>
              <span className="count">{counts.orgao}</span>
            </div>
            <h3>Órgãos Públicos</h3>
            <div className="sub">Contatos de órgãos e entidades públicas</div>
          </button>
          <button
            type="button"
            className={"vcard privada" + (filtro === 'privada' ? " on" : "")}
            onClick={() => setFiltro(filtro === 'privada' ? 'todos' : 'privada')}
            aria-pressed={filtro === 'privada'}
          >
            <div className="top">
              <span className="chip"><Icon name="briefcase" /></span>
              <span className="count">{counts.privada}</span>
            </div>
            <h3>Empresa Privada</h3>
            <div className="sub">Contatos de empresas e clientes privados</div>
          </button>
        </div>

        <div className="total-line">
          {filtro === 'todos'
            ? <><b>{counts.todos}</b> clientes no total</>
            : <>Mostrando <b>{filtro === 'orgao' ? counts.orgao : counts.privada}</b> de <b>{counts.todos}</b> clientes — <button type="button" className="clear" onClick={() => setFiltro('todos')}>Limpar filtro</button></>
          }
        </div>

        {/* Busca */}
        <div className="tools">
          <div className="search">
            <Icon name="search" />
            <input placeholder="Buscar por nome, CNPJ, cidade ou e-mail" value={busca} onChange={e=>setBusca(e.target.value)} />
          </div>
        </div>

        {loading && <p className="loading">Carregando contatos…</p>}
        {!loading && list.length === 0 && <p className="empty">Nenhum contato encontrado.</p>}
        {!loading && list.length > 0 && (
          <div className="clist">
            {list.map(c => (
              <button key={c.id} className="ccard" onClick={() => setEditing(c)}>
                <div className="c-h">
                  <h4>{c.nome}</h4>
                  <span className={"tag " + c.tipo}>{c.tipo==='orgao' ? 'Órgão público' : 'Empresa privada'}</span>
                </div>
                <div className="meta">
                  {c.cnpj && <span><Icon name="building" />{c.cnpj}</span>}
                  {c.telefone && <span><Icon name="phone" />{c.telefone}</span>}
                  {c.email && <span><Icon name="mail" />{c.email}</span>}
                  {c.cidade && <span><Icon name="pin" />{c.cidade}</span>}
                </div>
              </button>
            ))}
          </div>
        )}

        {editing !== null && (
          <ContatoDialog
            initial={editing}
            contatos={contatos}
            onClose={() => setEditing(null)}
            onSaved={() => setEditing(null)}
          />
        )}
      </main>
    </React.Fragment>
  );
}

(function(){try{var t=localStorage.getItem('novari-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
ReactDOM.createRoot(document.getElementById('root')).render(<AuthGate><App /></AuthGate>);
</script>
</body>

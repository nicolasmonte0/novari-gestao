<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Painel - Novari Print</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F4F7; --surface:#FFFFFF; --col:#E9ECF2; --hover:#F3F5F9;
  --ink:#111B33; --ink-2:#4B5673; --muted:#6B7690;
  --line:#DFE3EA; --line-strong:#C8CFDB;
  --brand:#151F38; --brand-ink:#FFFFFF; --accent:#2E86C7;
  --brand-red:#CE1B21; --brand-blue:#66B2E5;
  --alert:#B42318; --alert-bg:#FEF1EF; --warn:#A54A08; --ok:#067647;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0D1322; --surface:#151C2E; --col:#111828; --hover:#1C2540;
    --ink:#E8ECF5; --ink-2:#AAB3C8; --muted:#8B96AE;
    --line:#252E46; --line-strong:#34405C;
    --brand:#E8ECF5; --brand-ink:#0D1322; --accent:#66B2E5;
    --brand-red:#FF6B61; --brand-blue:#66B2E5;
    --alert:#FF8F80; --alert-bg:#3A1B18; --warn:#F2B25A; --ok:#5BD29A;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--line);border-top:3px solid var(--brand-red)}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;background:none;border:0;padding:0}
.logo-img{height:38px;width:auto;display:block}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.2;color:var(--ink);text-align:left}
.brand-sub{color:var(--muted);font-size:12.5px;text-align:left}

.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
.page-h{margin:0 0 20px}
.page-h h1{margin:0 0 4px;font-size:20px;font-weight:700;letter-spacing:-.01em}
.page-h p{margin:0;color:var(--muted);font-size:13px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.mcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;cursor:pointer;transition:border-color .15s,transform .1s;text-align:left;font:inherit;color:inherit}
.mcard:hover{border-color:var(--line-strong)}
.mcard:active{transform:scale(.99)}
.mcard.disabled{cursor:default;opacity:.55}
.mcard.disabled:hover{border-color:var(--line)}
.mcard .micon{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;margin-bottom:14px}
.mcard .micon .ic{width:21px;height:21px}
.mcard h3{margin:0 0 3px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.mcard p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5}
.badge-soon{position:absolute;top:16px;right:16px;font-size:10.5px;font-weight:600;color:var(--muted);background:var(--col);padding:3px 8px;border-radius:20px}
.ext-ic{width:13px;height:13px;color:var(--muted)}

</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <symbol id="i-package" viewBox="0 0 24 24"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></symbol>
  <symbol id="i-building" viewBox="0 0 24 24"><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.73Z"/><path d="M12 22V12"/><path d="m3.3 7 8.7 5 8.7-5"/></symbol>
  <symbol id="i-gavel" viewBox="0 0 24 24"><path d="m14.5 12.5-8 8a2.12 2.12 0 1 1-3-3l8-8"/><path d="m16 16 6-6"/><path d="m8 8 6-6"/><path d="m9 7 8 8"/><path d="m21 11-8-8"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
</svg>

<div id="root"></div>

<script type="text/babel">
const PEDIDOS_URL = "https://nicolasmonte0.github.io/pedidos-novari-print/";

function Icon({name, className}) {
  return <svg className={className || "ic"} viewBox="0 0 24 24"><use href={"#i-" + name} /></svg>;
}

function Header({onHome}) {
  return (
    <header className="top">
      <button className="brand" onClick={onHome}>
        <img src="novari-icon.png" alt="Novari Print" className="logo-img" />
        <div>
          <div className="brand-name">Novari Print</div>
          <div className="brand-sub">Gestão</div>
        </div>
      </button>
    </header>
  );
}

const MODULES = [
  {key:'contatos', nome:'Contatos', desc:'Clientes, fornecedores e órgãos públicos', icon:'users', bg:'#EAF5FC', fg:'#1D6FA5', status:'interno'},
  {key:'pedidos', nome:'Pedidos', desc:'Produção e entrega de pedidos', icon:'package', bg:'#FFFBEB', fg:'#92400E', status:'externo'},
  {key:'financeiro', nome:'Financeiro', desc:'Contas a pagar, a receber e fluxo de caixa', icon:'wallet', bg:'#F0FDF4', fg:'#166534', status:'interno'},
  {key:'administrativo', nome:'Administrativo', desc:'Dados da empresa, certidões e documentos', icon:'building', bg:'#F5F3FF', fg:'#5B21B6', status:'interno'},
  {key:'estoque', nome:'Estoque', desc:'Controle manual de itens', icon:'box', bg:'#FEF2F2', fg:'#991B1B', status:'interno'},
  {key:'licitacao', nome:'Licitação', desc:'Editais, concorrentes e inteligência de mercado', icon:'gavel', bg:'#ECFEFF', fg:'#0E7490', status:'em-breve'},
];

function Home({onOpen}) {
  return (
    <main className="wrap">
      <div className="page-h">
        <h1>Painel</h1>
        <p>Escolha um módulo para continuar.</p>
      </div>
      <div className="grid">
        {MODULES.map(m => {
          const disabled = m.status === 'em-breve';
          const external = m.status === 'externo';
          return (
            <button
              key={m.key}
              className={"mcard" + (disabled ? " disabled" : "")}
              onClick={() => { if (!disabled) onOpen(m); }}
              disabled={disabled}
            >
              {disabled && <span className="badge-soon">em breve</span>}
              <div className="micon" style={{background:m.bg, color:m.fg}}><Icon name={m.icon} /></div>
              <h3>{m.nome}{external && <Icon name="external" className="ext-ic" />}</h3>
              <p>{m.desc}</p>
            </button>
          );
        })}
      </div>
    </main>
  );
}

function App() {
  function openModule(m) {
    if (m.status === 'externo') {
      window.open(PEDIDOS_URL, '_blank', 'noopener');
      return;
    }
    if (m.status === 'interno') {
      window.open(m.key + '.html', '_blank', 'noopener');
      return;
    }
  }

  return (
    <React.Fragment>
      <Header onHome={() => {}} />
      <Home onOpen={openModule} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

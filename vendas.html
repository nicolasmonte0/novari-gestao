<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Vendas - Novari Print</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel" src="auth-gate.js"></script>
<style>
:root{
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --navy:#151F38; --red:#CE1B21; --blue:#66B2E5;
  --c-blue:#2E86C7; --c-sky:#2E9BD6; --c-green:#1E9E6A; --c-red:#CE1B21; --c-amber:#B4791A; --c-violet:#6D54C8;
  --side-bg:#151F38; --side-ink:#EEF2FB; --side-muted:#93A0C0;
  --side-active:rgba(206,27,33,.16); --side-hover:rgba(255,255,255,.06); --side-line:rgba(255,255,255,.09);
  --bg:#F3F4F7; --surface:#FFFFFF; --col:#EEF0F5; --hover:#F3F5F9;
  --ink:#111B33; --ink-2:#4B5673; --muted:#6B7690;
  --line:#E2E6EE; --line-strong:#CFD6E2;
  --brand:#151F38; --brand-ink:#FFFFFF; --accent:#2E86C7; --brand-red:#CE1B21; --brand-blue:#66B2E5;
  --alert:#B42318; --alert-bg:#FEF0EE; --warn:#A54A08; --warn-bg:#FDF3E7; --ok:#067647; --ok-bg:#E8F6EF;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --side-bg:#111A30;
  --bg:#0C1220; --surface:#151C2E; --col:#1A2238; --hover:#1C2540;
  --ink:#E8ECF5; --ink-2:#AEB8CE; --muted:#8B96AE;
  --line:#242D44; --line-strong:#34405C;
  --brand:#E8ECF5; --brand-ink:#0D1322; --accent:#66B2E5; --brand-red:#FF6B61; --brand-blue:#66B2E5;
  --alert:#FF8F80; --alert-bg:#331A18; --warn:#F2B25A; --warn-bg:#2E2212; --ok:#5BD29A; --ok-bg:#122A22;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --side-bg:#111A30;
  --bg:#0C1220; --surface:#151C2E; --col:#1A2238; --hover:#1C2540;
  --ink:#E8ECF5; --ink-2:#AEB8CE; --muted:#8B96AE;
  --line:#242D44; --line-strong:#34405C;
  --brand:#E8ECF5; --brand-ink:#0D1322; --accent:#66B2E5; --brand-red:#FF6B61; --brand-blue:#66B2E5;
  --alert:#FF8F80; --alert-bg:#331A18; --warn:#F2B25A; --warn-bg:#2E2212; --ok:#5BD29A; --ok-bg:#122A22;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
.back{display:none!important}
.page-h{margin:0 0 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.page-h h1{margin:0 0 4px;font-size:20px;font-weight:700;letter-spacing:-.01em}
.page-h p{margin:0;color:var(--muted);font-size:13px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);color:var(--ink);font-weight:500;font-size:13.5px;cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.accent:hover{filter:brightness(1.1)}
.btn.danger{color:var(--alert);border-color:var(--alert)}
.btn.danger:hover{background:var(--alert-bg)}
.btn.sm{height:30px;font-size:12px;padding:0 10px}
.btn[disabled]{opacity:.5;cursor:default}
.badge-new{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:2px;font-size:10.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.28);border-radius:20px}

/* Painel de importação */
.panel{background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;overflow:hidden;margin-bottom:16px}
.panel-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--col)}
.panel-h .chip{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.panel-h .chip .ic{width:17px;height:17px}
.panel-h h2{margin:0;font-size:14.5px;font-weight:700}
.panel-h p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}
.panel-b{padding:4px 20px 2px}
.improw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.improw:last-child{border-bottom:0}
.improw .nome{font-weight:600}
.improw .meta{color:var(--muted);font-size:12px;margin-top:1px}
.improw .valor{font-weight:700;white-space:nowrap}
.panel-f{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line);background:var(--col)}
.panel-f .tot{font-size:13px}
.panel-f .tot b{font-size:15px}
.panel-f .acts{display:flex;gap:8px}
.hint-box{display:flex;gap:9px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border-radius:9px;padding:10px 12px;font-size:12px;margin:12px 20px 16px}
.hint-box .ic{width:15px;height:15px;margin-top:1px;flex:none}

/* Cards de status (Vendas) */
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.vcard{position:relative;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;font:inherit;color:inherit}
.vcard:hover{border-color:var(--line-strong)}
.vcard.on{border-color:var(--vc)}
.vcard .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.vcard .chip{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--vbg);color:var(--vc)}
.vcard .chip .ic{width:21px;height:21px}
.vcard .count{font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.vcard h3{margin:0 0 4px;font-size:14px;font-weight:600;color:var(--ink)}
.vcard .val{font-size:15.5px;font-weight:700;color:var(--vc)}
.vcard.aprovado{--vc:var(--ok);--vbg:var(--ok-bg)}
.vcard.analise{--vc:var(--warn);--vbg:var(--warn-bg)}
.vcard.nao_aprovado{--vc:var(--alert);--vbg:var(--alert-bg)}
@media (max-width:760px){ .vgrid{grid-template-columns:1fr} }

/* Card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card-h h2{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-h .clear{font-size:12.5px;color:var(--accent);font-weight:600;cursor:pointer;background:none;border:0;padding:0}

/* Table */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--line);color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:var(--hover)}

/* Status badges */
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:20px}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.status.warn{background:var(--warn-bg);color:var(--warn)}
.status.alert{background:var(--alert-bg);color:var(--alert)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.ok{background:var(--ok)}
.dot.warn{background:var(--warn)}
.dot.alert{background:var(--alert)}

.empty{color:var(--muted);padding:30px 0;text-align:center}
.loading{color:var(--muted);padding:30px 0;text-align:center}

/* Dialog */
.ov{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(9,14,28,.55)}
.dlg{width:520px;max-width:100%;max-height:92vh;overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px 10px}
.dlg-h h2{margin:0;font-size:16px;font-weight:700}
.dlg-b{padding:6px 22px 18px}
.dlg-f{display:flex;gap:8px;justify-content:space-between;padding:14px 22px;border-top:1px solid var(--line)}
.dlg-f .right{display:flex;gap:8px}
.x{width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:6px;background:none;color:var(--muted);cursor:pointer;flex:none}
.x:hover{background:var(--hover);color:var(--ink)}
.form{display:grid;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label{display:block;margin-bottom:5px;font-weight:600;font-size:12.5px;color:var(--ink-2)}
.inp{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink);font-size:14px}
.inp:focus{border-color:var(--accent);outline:none}
select.inp{appearance:auto}
textarea.inp{height:70px;resize:vertical;font-family:inherit}
.fgroup-lab{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:2px 0 -4px}

/* Itens do orçamento */
.items{display:flex;flex-direction:column;gap:8px}
.item-row{background:var(--col);border:1px solid var(--line);border-radius:9px;padding:10px 12px 12px}
.item-num{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.item-grid{display:grid;grid-template-columns:1fr 70px 110px 100px 34px;gap:8px;align-items:end}
.item-grid .f label{font-size:11px;margin-bottom:4px}
.item-sub{height:38px;display:flex;align-items:center;font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.item-rm{width:34px;height:38px;display:grid;place-items:center;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--alert);cursor:pointer}
.item-rm:disabled{opacity:.35;cursor:default}
.item-add{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:12.5px;font-weight:700;color:var(--accent);background:#EAF3FB;border:1px dashed var(--accent);border-radius:7px;padding:7px 12px;cursor:pointer}
.items-total{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--col);border-radius:8px;font-size:13px}
.items-total b{font-size:15.5px}
@media (max-width:620px){ .item-grid{grid-template-columns:1fr 1fr;row-gap:10px} .item-grid .item-sub{grid-column:1/2} .item-grid .item-rm{grid-column:2/3;justify-self:end} }
.err{color:var(--alert);font-size:12.5px;margin:-4px 0 0}
.nf-link{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none}
.nf-link:hover{text-decoration:underline}
.linkrow{display:flex;gap:8px}
.linkrow .inp{flex:1;min-width:0}
.hint{margin:6px 0 0;font-size:12px;color:var(--muted)}
.btn.drive{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);white-space:nowrap}
@media (max-width:560px){ .linkrow{flex-wrap:wrap} .linkrow .btn{width:100%} }
@media (max-width:820px){.row2{grid-template-columns:1fr}}

/* ===== Casca padrão Novari (sidebar + topbar) ===== */
.side{position:fixed;left:0;top:0;bottom:0;width:238px;z-index:30;background:var(--side-bg);color:var(--side-ink);
  display:flex;flex-direction:column;gap:4px;padding:16px 12px calc(16px + env(safe-area-inset-bottom,0px));
  border-right:1px solid var(--side-line);overflow-y:auto}
.side-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;text-decoration:none}
.side-brand img{height:34px;width:auto;display:block;background:#fff;border-radius:8px;padding:3px}
.side-brand .nm{font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.15;color:var(--side-ink)}
.side-brand .sb{font-size:11.5px;color:var(--side-muted);letter-spacing:.03em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .lab{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);padding:12px 10px 4px}
.navi{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--side-ink);
  text-decoration:none;font-size:13.5px;font-weight:500;position:relative;opacity:.86;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.navi:hover{background:var(--side-hover);opacity:1}
.navi.active{background:var(--side-active);opacity:1;font-weight:600}
.navi.active::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--red)}
.navi.soon{opacity:.5;cursor:default}.navi.soon:hover{background:none}
.navi .ic{width:17px;height:17px;opacity:.95}
body{padding-left:238px}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--surface);
  border-bottom:1px solid var(--line);border-top:3px solid var(--red);position:sticky;top:0;z-index:10;
  padding-top:calc(12px + env(safe-area-inset-top,0px))}
.tb-search{flex:1;min-width:0;max-width:440px;display:flex;align-items:center;gap:9px;background:var(--col);
  border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted)}
.tb-search input{border:0;background:transparent;color:var(--ink);font-size:13.5px;width:100%;outline:none}
.tb-search input::placeholder{color:var(--muted)}
.tb-search .ic{width:16px;height:16px}
.tb-sp{flex:1}
.ib{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;color:var(--ink-2);background:transparent;border:1px solid transparent;cursor:pointer;position:relative}
.ib:hover{background:var(--hover);border-color:var(--line)}
.ib .ic{width:18px;height:18px}
.ib .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid var(--surface)}
.tb-user{display:flex;align-items:center;gap:10px;padding-left:2px}
.tb-ava{width:38px;height:38px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.tb-user .un{font-weight:600;font-size:13.5px;line-height:1.15}
.tb-user .ur{font-size:11.5px;color:var(--muted)}
.theme-moon,.theme-sun{display:none}
:root:not([data-theme]) .theme-moon{display:block}
@media (prefers-color-scheme:dark){ :root:not([data-theme]) .theme-moon{display:none} :root:not([data-theme]) .theme-sun{display:block} }
:root[data-theme="light"] .theme-moon{display:block}
:root[data-theme="dark"] .theme-sun{display:block}
@media (max-width:820px){
  body{padding-left:0}
  .side{position:static;width:auto;flex-direction:row;align-items:center;gap:8px;overflow-x:auto;padding:10px 12px;border-right:0;border-bottom:1px solid var(--side-line)}
  .side-brand{padding:0 8px 0 2px;border-right:1px solid var(--side-line);margin-right:4px}
  .side-brand .sb{display:none}
  .nav{flex-direction:row;gap:4px}
  .nav .lab{display:none}
  .navi{white-space:nowrap;padding:8px 11px;width:auto}
  .navi.active::before{display:none}
  .navi.active{box-shadow:inset 0 -2px 0 var(--red)}
}
@media (max-width:520px){ .topbar{flex-wrap:wrap} .tb-search{order:3;max-width:none;flex-basis:100%} .tb-user .un,.tb-user .ur{display:none} }

</style>
</head>

/* ── Helpers ─────────────────────────────── */
function fmtBRL(v) {
  return 'R$ ' + Number(v||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function isValidUrl(v) { return /^https?:\/\/\S+$/i.test((v||'').trim()); }
function parseDateBR(s) {
  if (!s) return null;
  const p = s.split('/');
  if (p.length === 3) return new Date(+p[2], +p[1]-1, +p[0]);
  return new Date(s);
}
function todayBR() {
  const d = new Date();
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}

const STATUS_META = {

};
function statusCls(s) { return s === 'aprovado' ? 'ok' : s === 'nao_aprovado' ? 'alert' : 'warn'; }

/* ── Importar pedidos do grupo "Comercial" (Pedidos) ───────── */
/* Espelha a lógica de groupOfStage do app Pedidos, para achar quais etapas
   pertencem ao card "Comercial" mesmo que o usuário tenha personalizado as etapas. */
const PEDIDOS_DEFAULT_STAGES = [
  { id:"proposta",  group:"comercial" },
  { id:"pendente",  group:"pendente" },
  { id:"confeccao", group:"producao" },
  { id:"entrega",   group:"logistica" },
  { id:"entregue",  group:"logistica" },
];
function stageGroup(id, allStages) {
  const s = (allStages || []).find(x => x.id === id);
  if (s && s.group) return s.group;
  const d = PEDIDOS_DEFAULT_STAGES.find(x => x.id === id);
  if (d) return d.group;
  if (/fatur/i.test(id) || (s && /fatur/i.test(s.label || ""))) return "faturamento";
  return "";
}
function useDocData(col, id) {
  const [data, setData] = useState(undefined); // undefined = carregando
  useEffect(() => {
    if (!db) return;
    const unsub = db.collection(col).doc(id).onSnapshot(
      snap => setData(snap.exists ? snap.data() : null),
      () => setData(null)
    );
    return unsub;
  }, [col, id]);
  return data;
}
function buildOrcamentoFromPedido(p) {
  let dataStr = todayBR();
  if (p.criadoEm) {
    const d = new Date(p.criadoEm);
    if (!isNaN(d)) dataStr = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
  }
  return {
    cliente: p.cliente || '',
    descricao: p.descricao || '',
    numero: p.numero || '',
    quantidade: p.quantidade ?? '',
    valorUnit: p.valorUnit ?? '',
    valor: Number(p.valor || 0),
    custo: p.custo ?? '',
    frete: p.frete ?? '',
    despesas: p.despesas ?? '',
    prazo: p.prazo || '',
    responsavel: p.responsavel || '',
    prioridade: p.prioridade || 'media',
    observacoes: p.observacoes || '',
    extras: p.extras || {},
    historico: [
      ...(p.historico || []),
      { data: new Date().toISOString(), acao: 'Transferido para Vendas', detalhes: 'Pedido do card Comercial transferido para Orçamentos em Análise' },
    ],
    status: 'analise',
    data: dataStr,
    validade: '',
    linkDrive: '',
    origemPedidoId: p.id,
    criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
  };
}

/* ── Generic Dialog ──────────────────────── */
function Dialog({title, onClose, onSave, onDelete, saving, err, children}) {
  return (
    <div className="ov" onClick={e => {if(e.target===e.currentTarget) onClose();}}>
      <div className="dlg" role="dialog" aria-modal="true">
        <div className="dlg-h">

          <button className="x" onClick={onClose}><Icon name="x"/></button>
        </div>
        <div className="dlg-b">
          {children}
          {err && <p className="err">{err}</p>}
        </div>
        <div className="dlg-f">
          <div>{onDelete && <button className="btn danger" onClick={onDelete} disabled={saving}><Icon name="trash"/> Excluir</button>}</div>
          <div className="right">
            <button className="btn" onClick={onClose}>Cancelar</button>
            <button className="btn primary" onClick={onSave} disabled={saving}>{saving ? 'Salvando…' : 'Salvar'}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── useCollection hook ──────────────────── */
function useCollection(name) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    if (!db) return;
    const unsub = db.collection(name).onSnapshot(snap => {
      setItems(snap.docs.map(d => ({id:d.id, ...d.data()})));
      setLoading(false);
    }, () => setLoading(false));
    return unsub;
  }, [name]);
  return {items, loading};
}

/* ── FORM: Novo / Editar Orçamento ───────── */
function newItemRow() {
  return { id: 'it' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), descricao: '', quantidade: '', valorUnit: '' };
}
function OrcamentoForm({data, onClose}) {
  const isEdit = !!(data && data.id);
  const {items: contatosItems} = useCollection('contatos');
  const empty = {
    cliente:'', descricao:'', numero:'', itens:[newItemRow()],
    custo:'', frete:'', despesas:'', prazo:'', responsavel:'', prioridade:'media',
    data:todayBR(), validade:'', status:'analise', linkDrive:'', observacoes:'',
  };
  const [form, setForm] = useState(data ? {
    ...empty, ...data,
    // orçamentos antigos guardavam um único produto nos campos quantidade/valorUnit;
    // viram o Item 1 automaticamente, sem perder nada.
    itens: (Array.isArray(data.itens) && data.itens.length) ? data.itens.map(it => ({
      id: 'it' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      descricao: it.descricao || '',
      quantidade: (it.quantidade === 0 || it.quantidade) ? it.quantidade : '',
      valorUnit: (it.valorUnit === 0 || it.valorUnit) ? it.valorUnit : '',
    })) : [{ ...newItemRow(), quantidade: (data.quantidade === 0 || data.quantidade) ? data.quantidade : '', valorUnit: (data.valorUnit === 0 || data.valorUnit) ? data.valorUnit : '' }],
    // compatibilidade com orçamentos antigos, que guardavam a nota em "observacao"
    observacoes: data.observacoes ?? data.observacao ?? '',
  } : empty);
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');
  const set = (k,v) => setForm(f => ({...f,[k]:v}));
  const setItem = (id,k,v) => setForm(f => ({...f, itens: f.itens.map(it => it.id===id ? {...it,[k]:v} : it)}));
  const addItem = () => setForm(f => ({...f, itens: [...f.itens, newItemRow()]}));
  const removeItem = (id) => setForm(f => ({...f, itens: f.itens.length>1 ? f.itens.filter(it=>it.id!==id) : f.itens}));

  const itensTotal = form.itens.reduce((s,it) => s + (Number(it.quantidade)||0)*(Number(it.valorUnit)||0), 0);

  async function save() {
    if (!form.cliente.trim()) {setErr('Informe o cliente ou órgão.'); return;}
    if (itensTotal <= 0) {setErr('Adicione ao menos um item com quantidade e valor.'); return;}
    setErr(''); setSaving(true);
    try {
      const d = {
        cliente: form.cliente.trim(),
        descricao: (form.descricao||'').trim(),
        numero: (form.numero||'').trim(),
        itens: form.itens.map(it => ({
          descricao: (it.descricao||'').trim(),
          quantidade: Number(it.quantidade) || 0,
          valorUnit: Number(it.valorUnit) || 0,
        })),
        valor: itensTotal,
        custo: form.custo === '' ? '' : Number(form.custo) || 0,
        frete: form.frete === '' ? '' : Number(form.frete) || 0,
        despesas: form.despesas === '' ? '' : Number(form.despesas) || 0,
        prazo: (form.prazo||'').trim(),
        responsavel: (form.responsavel||'').trim(),
        prioridade: form.prioridade || 'media',
        data: (form.data||'').trim(),
        validade: (form.validade||'').trim(),
        status: form.status || 'analise',
        linkDrive: (form.linkDrive||'').trim(),
        observacoes: (form.observacoes||'').trim(),
      };
      if (isEdit) {
        // limpa os campos antigos de produto único, já substituídos por "itens"
        d.quantidade = firebase.firestore.FieldValue.delete();
        d.valorUnit = firebase.firestore.FieldValue.delete();
        await db.collection('orcamentos').doc(data.id).update(d);
      } else {
        d.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
        await db.collection('orcamentos').add(d);
      }
      onClose();
    } catch(e) { console.error(e); setErr('Erro ao salvar.'); } finally { setSaving(false); }
  }

  async function remove() {
    if (!window.confirm('Excluir este orçamento?')) return;
    setSaving(true);
    try { await db.collection('orcamentos').doc(data.id).delete(); onClose(); }
    catch(e) { console.error(e); setErr('Erro ao excluir.'); setSaving(false); }
  }

  return (
    <Dialog title={isEdit ? 'Editar Orçamento' : 'Novo Orçamento'} onClose={onClose} onSave={save} onDelete={isEdit ? remove : null} saving={saving} err={err}>
      <div className="form">
        <div className="f">
          <label>Cliente / Órgão *</label>
          <input className="inp" list="clientes-dl" value={form.cliente} onChange={e=>set('cliente',e.target.value)} placeholder="Ex: Prefeitura de Manaus — Seduc"/>
          <datalist id="clientes-dl">
            {contatosItems.map(c => <option key={c.id} value={c.nome} />)}
          </datalist>
        </div>
        <div className="row2">
          <div className="f"><label>Nº do processo ou licitação</label><input className="inp" value={form.numero} onChange={e=>set('numero',e.target.value)} placeholder="014/2026"/></div>
          <div className="f"><label>Descrição geral</label><input className="inp" value={form.descricao} onChange={e=>set('descricao',e.target.value)} placeholder="Ex: Material gráfico — pregão 014/2026"/></div>
        </div>

        <div className="fgroup-lab">Itens do orçamento</div>
        <div className="items">
          {form.itens.map((it,i) => (
            <div className="item-row" key={it.id}>
              <div className="item-num">Item {i+1}</div>
              <div className="item-grid">
                <div className="f"><label>Descrição do item</label><input className="inp" value={it.descricao} onChange={e=>setItem(it.id,'descricao',e.target.value)} placeholder="Ex: Banner lona 2x1m"/></div>
                <div className="f"><label>Qtd.</label><input className="inp" type="number" value={it.quantidade} onChange={e=>setItem(it.id,'quantidade',e.target.value)} placeholder="1"/></div>
                <div className="f"><label>Valor unit. (R$)</label><input className="inp" type="number" step="0.01" value={it.valorUnit} onChange={e=>setItem(it.id,'valorUnit',e.target.value)} placeholder="0.00"/></div>
                <div className="item-sub">{fmtBRL((Number(it.quantidade)||0)*(Number(it.valorUnit)||0))}</div>
                <button type="button" className="item-rm" title="Remover item" disabled={form.itens.length<=1} onClick={()=>removeItem(it.id)}>
                  <Icon name="trash" style={{width:14,height:14}}/>
                </button>
              </div>
            </div>
          ))}
          <button type="button" className="item-add" onClick={addItem}><Icon name="plus" style={{width:14,height:14}}/> Adicionar item</button>
          <div className="items-total"><span>Total dos itens ({form.itens.length})</span><b>{fmtBRL(itensTotal)}</b></div>
        </div>

        <div className="fgroup-lab">Custos adicionais</div>
        <div className="row2">
          <div className="f"><label>Custo de produção (R$)</label><input className="inp" type="number" step="0.01" value={form.custo} onChange={e=>set('custo',e.target.value)} placeholder="0.00"/></div>
          <div className="f"><label>Frete (R$)</label><input className="inp" type="number" step="0.01" value={form.frete} onChange={e=>set('frete',e.target.value)} placeholder="0.00"/></div>
        </div>
        <div className="f"><label>Outras despesas (R$)</label><input className="inp" type="number" step="0.01" value={form.despesas} onChange={e=>set('despesas',e.target.value)} placeholder="0.00"/></div>

        <div className="fgroup-lab">Prazo e responsável</div>
        <div className="row2">
          <div className="f"><label>Prazo de entrega</label><input className="inp" type="date" value={form.prazo} onChange={e=>set('prazo',e.target.value)}/></div>
          <div className="f"><label>Responsável / fornecedor</label><input className="inp" value={form.responsavel} onChange={e=>set('responsavel',e.target.value)} placeholder="Nome"/></div>
        </div>
        <div className="row2">
          <div className="f">
            <label>Prioridade</label>
            <select className="inp" value={form.prioridade} onChange={e=>set('prioridade',e.target.value)}>
              <option value="urgente">Urgente</option>
              <option value="alta">Alta</option>
              <option value="media">Média</option>
              <option value="baixa">Baixa</option>
            </select>
          </div>
          <div className="f">
            <label>Status</label>
            <select className="inp" value={form.status} onChange={e=>set('status',e.target.value)}>
              <option value="analise">Em Análise</option>
              <option value="aprovado">Aprovado</option>
              <option value="nao_aprovado">Não Aprovado</option>
            </select>
          </div>
        </div>

        <div className="fgroup-lab">Vendas</div>
        <div className="row2">
          <div className="f"><label>Data do orçamento</label><input className="inp" value={form.data} onChange={e=>set('data',e.target.value)} placeholder="dd/mm/aaaa"/></div>
          <div className="f"><label>Validade</label><input className="inp" value={form.validade} onChange={e=>set('validade',e.target.value)} placeholder="dd/mm/aaaa"/></div>
        </div>
        <div className="f">
          <label>Orçamento (link do Google Drive)</label>
          <div className="linkrow">
            <input className="inp" value={form.linkDrive} onChange={e=>set('linkDrive',e.target.value)} placeholder="Cole aqui o link do orçamento (PDF)"/>
            {isValidUrl(form.linkDrive) && <a className="btn drive" href={form.linkDrive.trim()} target="_blank" rel="noopener"><Icon name="folder"/> Abrir</a>}
          </div>
          <p className="hint">{form.linkDrive && !isValidUrl(form.linkDrive) ? 'Cole o link completo, começando com https://' : 'Só o link é guardado, nenhum arquivo entra no sistema.'}</p>
        </div>
        <div className="f"><label>Observações</label><textarea className="inp" value={form.observacoes} onChange={e=>set('observacoes',e.target.value)} placeholder="Notas adicionais"/></div>
      </div>
    </Dialog>
  );
}

  const {items, loading} = useCollection('orcamentos');
  const {items: pedidosItems} = useCollection('pedidos');
  const stagesDoc = useDocData('config', 'stages');
  const [filtro, setFiltro] = useState(null);
  const [editItem, setEditItem] = useState(null);
  const [showForm, setShowForm] = useState(false);

  const [impOpen, setImpOpen] = useState(false);
  const [impList, setImpList] = useState([]);
  const [impRunning, setImpRunning] = useState(false);
  const [impResults, setImpResults] = useState(null);

  const stagesList = (stagesDoc && Array.isArray(stagesDoc.list) && stagesDoc.list.length) ? stagesDoc.list : PEDIDOS_DEFAULT_STAGES;
  const comercialIds = stagesList.filter(s => stageGroup(s.id, stagesList) === 'comercial').map(s => s.id);
  const comercialPedidos = pedidosItems.filter(p => comercialIds.includes(p.status));

  function openImport() {
    setImpList(comercialPedidos);
    setImpResults(null);
    setImpOpen(true);
  }
  function closeImport() {
    setImpOpen(false);
    setImpResults(null);
    setImpList([]);
  }
  async function runImport() {
    setImpRunning(true);
    const results = [];
    for (const p of impList) {
      try {
        await db.collection('orcamentos').add(buildOrcamentoFromPedido(p));
        await db.collection('pedidos').doc(p.id).delete();
        results.push({ id: p.id, cliente: p.cliente, ok: true });
      } catch (e) {
        console.error(e);
        results.push({ id: p.id, cliente: p.cliente, ok: false, err: (e && e.message) || 'erro desconhecido' });
      }
    }
    setImpResults(results);
    setImpRunning(false);
  }

  const porStatus = (s) => items.filter(o => o.status === s);
  const totalDe = (arr) => arr.reduce((s,o) => s + Number(o.valor||0), 0);

  const visiveis = (filtro ? items.filter(o => o.status === filtro) : items).slice().sort((a,b) => {
    const da = parseDateBR(a.data), db2 = parseDateBR(b.data);
    if (da && db2) return db2 - da;
    return (b.criadoEm?.seconds||0) - (a.criadoEm?.seconds||0);
  });

  return (
    <>
      <Header />
      <main className="wrap">
        <a href={PAINEL_URL} className="back"><Icon name="back"/> Voltar ao Painel</a>
        <div className="page-h">
          <div><h1>Vendas</h1><p>Orçamentos enviados a clientes e órgãos públicos.</p></div>
          <div className="hbtns">
            {comercialPedidos.length > 0 && (
              <button className="btn accent" onClick={openImport}>
                <Icon name="upload"/> Importar do Pedidos<span className="badge-new">{comercialPedidos.length}</span>
              </button>
            )}
            <button className="btn primary" onClick={() => {setEditItem(null); setShowForm(true);}}><Icon name="plus"/> Novo Orçamento</button>
          </div>
        </div>

        {loading ? <div className="loading">Carregando…</div> : (
          <>
            {impOpen && (
              <div className="panel">
                <div className="panel-h">
                  <div className="chip"><Icon name="upload"/></div>
                  <div>
                    <h2>Importar pedidos do card "Comercial"</h2>
                    <p>{impResults ? 'Resultado da transferência' : (impList.length + (impList.length===1 ? ' pedido será copiado' : ' pedidos serão copiados') + ' para "Orçamentos em Análise" com todos os campos preservados')}</p>
                  </div>
                </div>
                {!impResults ? (
                  <>
                    <div className="panel-b">
                      {impList.length === 0 ? <div className="empty">Nenhum pedido no card Comercial.</div> : impList.map(p => (
                        <div className="improw" key={p.id}>
                          <div>
                            <div className="nome">{p.cliente || '(sem cliente)'}</div>
                            <div className="meta">{p.numero ? ('Nº ' + p.numero + ' · ') : ''}{p.descricao || '—'}</div>
                          </div>
                          <div className="valor">{fmtBRL(p.valor)}</div>
                        </div>
                      ))}
                    </div>
                    {impList.length > 0 && (
                      <div className="hint-box">
                        <Icon name="alert"/>
                        <span>Cada pedido só é apagado do Pedidos depois que a cópia em Vendas é salva com sucesso. Se algum falhar, ele continua em Pedidos e aparece no resultado como "não transferido".</span>
                      </div>
                    )}
                    <div className="panel-f">
                      <div className="tot">{impList.length} pedido{impList.length===1?'':'s'} · <b>{fmtBRL(impList.reduce((s,p)=>s+Number(p.valor||0),0))}</b> no total</div>
                      <div className="acts">
                        <button className="btn" onClick={closeImport} disabled={impRunning}>Cancelar</button>
                        {impList.length > 0 && <button className="btn accent" onClick={runImport} disabled={impRunning}>{impRunning ? 'Transferindo…' : 'Confirmar transferência'}</button>}
                      </div>
                    </div>
                  </>
                ) : (
                  <>
                    <div className="panel-b">
                      {impResults.map(r => (
                        <div className="improw" key={r.id}>
                          <div className="nome">{r.cliente || '(sem cliente)'}</div>
                          <div className="valor" style={{color: r.ok ? 'var(--ok)' : 'var(--alert)'}}>{r.ok ? '✓ Transferido' : ('✗ Falhou: ' + r.err)}</div>
                        </div>
                      ))}
                    </div>
                    <div className="panel-f">
                      <div className="tot">{impResults.filter(r=>r.ok).length} de {impResults.length} transferidos com sucesso</div>
                      <div className="acts"><button className="btn primary" onClick={closeImport}>Fechar</button></div>
                    </div>
                  </>
                )}
              </div>
            )}

            <div className="vgrid">
              {['aprovado','analise','nao_aprovado'].map(s => {
                const arr = porStatus(s);
                const meta = STATUS_META[s];
                const on = filtro === s;
                return (
                  <button key={s} className={"vcard " + s + (on ? " on" : "")} onClick={() => setFiltro(on ? null : s)}>
                    <div className="top">
                      <div className="chip"><Icon name={meta.icon}/></div>
                      <span className="count">{arr.length}</span>
                    </div>
                    <h3>{meta.cardTitle}</h3>
                    <div className="val">{fmtBRL(totalDe(arr))}</div>
                  </button>
                );
              })}
            </div>

            <div className="card">
              <div className="card-h">
                <h2>{filtro ? ('Orçamentos — ' + STATUS_META[filtro].label) : 'Todos os orçamentos'}</h2>
                {filtro && <button className="clear" onClick={() => setFiltro(null)}>Limpar filtro</button>}
              </div>
              {visiveis.length === 0 ? <div className="empty">Nenhum orçamento encontrado.</div> : (
                <div className="tbl-wrap">
                  <table className="tbl">
                    <thead><tr><th>Cliente / Órgão</th><th>Valor</th><th>Data</th><th>Validade</th><th>Status</th><th></th></tr></thead>
                    <tbody>
                      {visiveis.map(o => (
                        <tr key={o.id}>
                          <td>
                            <div style={{fontWeight:600}}>{o.cliente}</div>
                            {o.descricao && <div style={{color:'var(--muted)', fontSize:12.5}}>{o.descricao}</div>}
                          </td>
                          <td style={{fontWeight:600}}>{fmtBRL(o.valor)}</td>
                          <td>{o.data || '—'}</td>
                          <td>{o.validade || '—'}</td>
                          <td><span className={"status " + statusCls(o.status)}><span className={"dot " + statusCls(o.status)}></span>{STATUS_META[o.status]?.label || o.status}</span></td>
                          <td><button className="btn sm" onClick={() => {setEditItem(o); setShowForm(true);}}><Icon name="edit" style={{width:13,height:13}}/></button></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </>
        )}
      </main>
      {showForm && <OrcamentoForm data={editItem} onClose={() => setShowForm(false)} />}
    </>
  );
}

(function(){try{var t=localStorage.getItem('novari-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
ReactDOM.createRoot(document.getElementById('root')).render(<AuthGate><App /></AuthGate>);
</script>
</body>
</html>

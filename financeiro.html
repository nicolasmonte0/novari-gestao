<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Financeiro - Novari Print</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  --bg:#F3F4F7; --surface:#FFFFFF; --col:#E9ECF2; --hover:#F3F5F9;
  --ink:#111B33; --ink-2:#4B5673; --muted:#6B7690;
  --line:#DFE3EA; --line-strong:#C8CFDB;
  --brand:#151F38; --brand-ink:#FFFFFF; --accent:#2E86C7;
  --brand-red:#CE1B21; --brand-blue:#66B2E5;
  --alert:#B42318; --alert-bg:#FEF1EF; --warn:#A54A08; --warn-bg:#FFF8EB; --ok:#067647; --ok-bg:#ECFDF3;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0D1322; --surface:#151C2E; --col:#111828; --hover:#1C2540;
    --ink:#E8ECF5; --ink-2:#AAB3C8; --muted:#8B96AE;
    --line:#252E46; --line-strong:#34405C;
    --brand:#E8ECF5; --brand-ink:#0D1322; --accent:#66B2E5;
    --brand-red:#FF6B61; --brand-blue:#66B2E5;
    --alert:#FF8F80; --alert-bg:#3A1B18; --warn:#F2B25A; --warn-bg:#3A2E18; --ok:#5BD29A; --ok-bg:#183A28;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--line);border-top:3px solid var(--brand-red)}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;background:none;border:0;padding:0}
.logo-img{height:38px;width:auto;display:block}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.2;color:var(--ink);text-align:left}
.brand-sub{color:var(--muted);font-size:12.5px;text-align:left}

.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink-2);font-size:13px;font-weight:500;cursor:pointer;padding:0;margin-bottom:10px}
.back:hover{color:var(--ink)}
.page-h{margin:0 0 20px}
.page-h h1{margin:0 0 4px;font-size:20px;font-weight:700;letter-spacing:-.01em}
.page-h p{margin:0;color:var(--muted);font-size:13px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);color:var(--ink);font-weight:500;font-size:13.5px;cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.danger{color:var(--alert);border-color:var(--alert)}
.btn.danger:hover{background:var(--alert-bg)}
.btn.sm{height:30px;font-size:12px;padding:0 10px}
.btn[disabled]{opacity:.5;cursor:default}

/* Summary */
.summary-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.summary-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;position:relative;overflow:hidden}
.summary-card .stripe{position:absolute;top:0;left:0;right:0;height:3px}
.summary-card .label{font-size:12.5px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.summary-card .value{font-size:22px;font-weight:700;letter-spacing:-.02em}
.summary-card .sub{font-size:12px;color:var(--muted);margin-top:4px}

/* Tabs */
.tabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:20px;gap:0;overflow-x:auto}
.tab{padding:10px 18px;border:0;background:none;color:var(--muted);font-weight:600;font-size:13.5px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* Card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card-h h2{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}

/* Table */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--line);color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:var(--hover)}

/* Status badges */
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:20px}
.status.ok,.status.pago,.status.recebido{background:var(--ok-bg);color:var(--ok)}
.status.warn,.status.pendente{background:var(--warn-bg);color:var(--warn)}
.status.alert,.status.vencido{background:var(--alert-bg);color:var(--alert)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.ok,.dot.pago,.dot.recebido{background:var(--ok)}
.dot.warn,.dot.pendente{background:var(--warn)}
.dot.alert,.dot.vencido{background:var(--alert)}

/* Tipo badge */
.tipo{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.02em}
.tipo.fixa{background:#EEF2FF;color:#4338CA}
.tipo.variavel{background:#FEF3C7;color:#92400E}
.tipo.pedido{background:#DBEAFE;color:#1E40AF}
.tipo.servico{background:#E0E7FF;color:#3730A3}
@media (prefers-color-scheme: dark){
  .tipo.fixa{background:#1E1B4B;color:#A5B4FC}
  .tipo.variavel{background:#451A03;color:#FCD34D}
  .tipo.pedido{background:#172554;color:#93C5FD}
  .tipo.servico{background:#1E1B4B;color:#C7D2FE}
}

/* Value colors */
.val-red{color:var(--alert)}
.val-green{color:var(--ok)}

/* Filter row */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter-btn{padding:6px 14px;border:1px solid var(--line-strong);border-radius:20px;background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:500;cursor:pointer}
.filter-btn:hover{background:var(--hover);color:var(--ink)}
.filter-btn.active{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

/* Fluxo de caixa */
.fluxo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.fluxo-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;text-align:center}
.fluxo-card .mes{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:8px;text-transform:uppercase}
.fluxo-card .entradas{font-size:13px;color:var(--ok);font-weight:600}
.fluxo-card .saidas{font-size:13px;color:var(--alert);font-weight:600}
.fluxo-card .saldo{font-size:15px;font-weight:700;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.fluxo-card .saldo.pos{color:var(--ok)}
.fluxo-card .saldo.neg{color:var(--alert)}

/* Dialog */
.ov{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(9,14,28,.55)}
.dlg{width:520px;max-width:100%;max-height:92vh;overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px 10px}
.dlg-h h2{margin:0;font-size:16px;font-weight:700}
.dlg-b{padding:6px 22px 18px}
.dlg-f{display:flex;gap:8px;justify-content:space-between;padding:14px 22px;border-top:1px solid var(--line)}
.dlg-f .right{display:flex;gap:8px}
.x{width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:6px;background:none;color:var(--muted);cursor:pointer;flex:none}
.x:hover{background:var(--hover);color:var(--ink)}
.form{display:grid;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label{display:block;margin-bottom:5px;font-weight:600;font-size:12.5px;color:var(--ink-2)}
.inp{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink);font-size:14px}
.inp:focus{border-color:var(--accent);outline:none}
select.inp{appearance:auto}
.err{color:var(--alert);font-size:12.5px;margin:-4px 0 0}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.loading{color:var(--muted);padding:30px 0;text-align:center}

@media (max-width:820px){.row2{grid-template-columns:1fr}}
@media (max-width:600px){.summary-row{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.fluxo-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></symbol>
  <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></symbol>
  <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></symbol>
  <symbol id="i-trending" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></symbol>

  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>

  <symbol id="i-calendar" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></symbol>
</svg>

<div id="root"></div>

<script type="text/babel">
const {useState, useEffect, useCallback, useMemo} = React;

const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyBLIEql90vc_KqDCbTyflRKJEbWrC-fSjo",
  authDomain:        "licitatrack.firebaseapp.com",
  projectId:         "licitatrack",
  storageBucket:     "licitatrack.firebasestorage.app",
  messagingSenderId: "459723534294",
  appId:             "1:459723534294:web:2e4ccc95565c6ef0c3be77"
};
let db = null;
try {
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
} catch(e) { console.error(e); }

const PAINEL_URL = "./";

function Icon({name, className, style}) {
  return <svg className={className || "ic"} style={style} viewBox="0 0 24 24"><use href={"#i-" + name} /></svg>;
}

/* ── Helpers ─────────────────────────────── */
function fmtDate(d) {
  if (!d) return '—';
  if (d.toDate) d = d.toDate();
  if (typeof d === 'string') d = new Date(d);
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return `${dd}/${mm}/${d.getFullYear()}`;
}
function parseDateBR(s) {
  if (!s) return null;
  const p = s.split('/');
  if (p.length === 3) return new Date(+p[2], +p[1]-1, +p[0]);
  return new Date(s);
}
function diasAte(dateStr) {
  if (!dateStr) return 999;
  const d = parseDateBR(dateStr);
  if (isNaN(d)) return 999;
  return Math.ceil((d - new Date()) / 86400000);
}
function fmtBRL(v) {
  return 'R$ ' + Number(v||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function contaStatus(vencimento, statusField) {
  if (statusField === 'pago' || statusField === 'recebido') return statusField;
  const d = diasAte(vencimento);
  if (d < 0) return 'vencido';
  return 'pendente';
}
function statusLabel(s) {
  if (s === 'pago') return 'Pago';
  if (s === 'recebido') return 'Recebido';
  if (s === 'vencido') return 'Vencida';
  return 'Pendente';
}
function statusCls(s) {
  if (s === 'pago' || s === 'recebido') return s;
  if (s === 'vencido') return 'vencido';
  return 'pendente';
}

const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

/* ── Header ──────────────────────────────── */
function Header() {
  return (
    <header className="top">
      <a href={PAINEL_URL} className="brand" style={{textDecoration:'none'}}>
        <img src="novari-icon.png" alt="Novari Print" className="logo-img" />
        <div>
          <div className="brand-name">Novari Print</div>
          <div className="brand-sub">Gestão</div>
        </div>
      </a>
    </header>
  );
}

/* ── Generic Dialog ──────────────────────── */
function Dialog({title, onClose, onSave, onDelete, saving, err, children}) {
  return (
    <div className="ov" onClick={e => {if(e.target===e.currentTarget) onClose();}}>
      <div className="dlg" role="dialog" aria-modal="true">
        <div className="dlg-h">
          <h2>{title}</h2>
          <button className="x" onClick={onClose}><Icon name="x"/></button>
        </div>
        <div className="dlg-b">
          {children}
          {err && <p className="err">{err}</p>}
        </div>
        <div className="dlg-f">
          <div>{onDelete && <button className="btn danger" onClick={onDelete} disabled={saving}><Icon name="trash"/> Excluir</button>}</div>
          <div className="right">
            <button className="btn" onClick={onClose}>Cancelar</button>
            <button className="btn primary" onClick={onSave} disabled={saving}>{saving ? 'Salvando…' : 'Salvar'}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── useCollection hook ──────────────────── */
function useCollection(name) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    if (!db) return;
    const unsub = db.collection(name).onSnapshot(snap => {
      setItems(snap.docs.map(d => ({id:d.id, ...d.data()})));
      setLoading(false);
    }, () => setLoading(false));
    return unsub;
  }, [name]);
  return {items, loading};
}

/* ── CONTAS A PAGAR TAB ─────────────────── */
function ContasPagarTab() {
  const {items, loading} = useCollection('contas_pagar');
  const [editItem, setEditItem] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [filtro, setFiltro] = useState('todas');

  if (loading) return <div className="loading">Carregando…</div>;

  const itemsComStatus = items.map(c => ({...c, _status: contaStatus(c.vencimento, c.status)}));
  const filtered = filtro === 'todas' ? itemsComStatus :
    itemsComStatus.filter(c => {
      if (filtro === 'pendentes') return c._status === 'pendente';
      if (filtro === 'vencidas') return c._status === 'vencido';
      if (filtro === 'pagas') return c._status === 'pago';
      return true;
    });

  const sorted = [...filtered].sort((a,b) => {
    const order = {vencido:0, pendente:1, pago:2};
    if (order[a._status] !== order[b._status]) return order[a._status] - order[b._status];
    const da = parseDateBR(a.vencimento), db2 = parseDateBR(b.vencimento);
    if (da && db2) return da - db2;
    return 0;
  });

  return (
    <>
      <div className="card">
        <div className="card-h">
          <h2><Icon name="arrow-down"/> Contas a Pagar</h2>
          <button className="btn primary" onClick={() => {setEditItem(null); setShowForm(true);}}><Icon name="plus"/> Nova Conta</button>
        </div>
        <div className="filter-row">
          {['todas','pendentes','vencidas','pagas'].map(f => (
            <button key={f} className={`filter-btn${filtro===f?' active':''}`} onClick={() => setFiltro(f)}>
              {f.charAt(0).toUpperCase()+f.slice(1)}
            </button>
          ))}
        </div>
        {sorted.length === 0 ? <div className="empty">Nenhuma conta a pagar encontrada.</div> : (
          <div className="tbl-wrap">
            <table className="tbl">
              <thead><tr><th>Descrição</th><th>Categoria</th><th>Fornecedor</th><th>Vencimento</th><th>Valor</th><th>Status</th><th></th></tr></thead>
              <tbody>
                {sorted.map(c => {
                  const st = c._status;
                  const isPago = st === 'pago';
                  return (
                    <tr key={c.id}>
                      <td style={{fontWeight:600}}>{c.descricao}</td>
                      <td><span className={`tipo ${c.categoria||'variavel'}`}>{c.categoria === 'fixa' ? 'Fixa' : 'Variável'}</span></td>
                      <td>{c.fornecedor || '—'}</td>
                      <td>{c.vencimento || '—'}</td>
                      <td style={{fontWeight:600, color: isPago ? 'var(--muted)' : 'var(--alert)', textDecoration: isPago ? 'line-through' : 'none'}}>{fmtBRL(c.valor)}</td>
                      <td><span className={`status ${statusCls(st)}`}><span className={`dot ${statusCls(st)}`}></span> {statusLabel(st)}</span></td>
                      <td><button className="btn sm" onClick={() => {setEditItem(c); setShowForm(true);}}><Icon name="edit" style={{width:13,height:13}}/></button></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
      {showForm && <ContaPagarForm data={editItem} onClose={() => setShowForm(false)} />}
    </>
  );
}

function ContaPagarForm({data, onClose}) {
  const isEdit = !!(data && data.id);
  const empty = {descricao:'', categoria:'variavel', fornecedor:'', vencimento:'', valor:'', status:'pendente', dataPagamento:'', observacao:''};
  const [form, setForm] = useState(data ? {...empty,...data, valor: String(data.valor||'')} : empty);
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');
  const set = (k,v) => setForm(f => ({...f,[k]:v}));

  async function save() {
    if (!form.descricao.trim()) {setErr('Informe a descrição.'); return;}
    if (!form.valor || Number(form.valor) <= 0) {setErr('Informe o valor.'); return;}
    setErr(''); setSaving(true);
    try {
      const d = {
        descricao: form.descricao.trim(),
        categoria: form.categoria || 'variavel',
        fornecedor: (form.fornecedor||'').trim(),
        vencimento: (form.vencimento||'').trim(),
        valor: Number(form.valor) || 0,
        status: form.status || 'pendente',
        dataPagamento: (form.dataPagamento||'').trim(),
        observacao: (form.observacao||'').trim(),
      };
      if (isEdit) await db.collection('contas_pagar').doc(data.id).update(d);
      else { d.criadoEm = firebase.firestore.FieldValue.serverTimestamp(); await db.collection('contas_pagar').add(d); }
      onClose();
    } catch(e) { console.error(e); setErr('Erro ao salvar.'); } finally { setSaving(false); }
  }

  async function remove() {
    if (!window.confirm('Excluir esta conta?')) return;
    setSaving(true);
    try { await db.collection('contas_pagar').doc(data.id).delete(); onClose(); }
    catch(e) { console.error(e); setErr('Erro ao excluir.'); setSaving(false); }
  }

  return (
    <Dialog title={isEdit ? 'Editar Conta a Pagar' : 'Nova Conta a Pagar'} onClose={onClose} onSave={save} onDelete={isEdit ? remove : null} saving={saving} err={err}>
      <div className="form">
        <div className="f"><label>Descrição *</label><input className="inp" value={form.descricao} onChange={e=>set('descricao',e.target.value)} placeholder="Ex: Aluguel — Galpão Industrial"/></div>
        <div className="row2">
          <div className="f">
            <label>Categoria</label>
            <select className="inp" value={form.categoria} onChange={e=>set('categoria',e.target.value)}>
              <option value="fixa">Fixa</option>
              <option value="variavel">Variável</option>
            </select>
          </div>
          <div className="f"><label>Fornecedor</label><input className="inp" value={form.fornecedor} onChange={e=>set('fornecedor',e.target.value)} placeholder="Ex: Imobiliária Norte"/></div>
        </div>
        <div className="row2">
          <div className="f"><label>Vencimento (dd/mm/aaaa)</label><input className="inp" value={form.vencimento} onChange={e=>set('vencimento',e.target.value)} placeholder="05/11/2026"/></div>
          <div className="f"><label>Valor (R$) *</label><input className="inp" type="number" step="0.01" value={form.valor} onChange={e=>set('valor',e.target.value)} placeholder="4500.00"/></div>
        </div>
        <div className="row2">
          <div className="f">
            <label>Status</label>
            <select className="inp" value={form.status} onChange={e=>set('status',e.target.value)}>
              <option value="pendente">Pendente</option>
              <option value="pago">Pago</option>
            </select>
          </div>
          <div className="f"><label>Data Pagamento</label><input className="inp" value={form.dataPagamento} onChange={e=>set('dataPagamento',e.target.value)} placeholder="dd/mm/aaaa"/></div>
        </div>
        <div className="f"><label>Observação</label><input className="inp" value={form.observacao} onChange={e=>set('observacao',e.target.value)} placeholder="Notas adicionais"/></div>
      </div>
    </Dialog>
  );
}

/* ── CONTAS A RECEBER TAB ───────────────── */
function ContasReceberTab() {
  const {items, loading} = useCollection('contas_receber');
  const [editItem, setEditItem] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [filtro, setFiltro] = useState('todas');

  if (loading) return <div className="loading">Carregando…</div>;

  const itemsComStatus = items.map(c => ({...c, _status: contaStatus(c.vencimento, c.status)}));
  const filtered = filtro === 'todas' ? itemsComStatus :
    itemsComStatus.filter(c => {
      if (filtro === 'pendentes') return c._status === 'pendente';
      if (filtro === 'vencidas') return c._status === 'vencido';
      if (filtro === 'recebidas') return c._status === 'recebido';
      return true;
    });

  const sorted = [...filtered].sort((a,b) => {
    const order = {vencido:0, pendente:1, recebido:2};
    if (order[a._status] !== order[b._status]) return order[a._status] - order[b._status];
    const da = parseDateBR(a.vencimento), db2 = parseDateBR(b.vencimento);
    if (da && db2) return da - db2;
    return 0;
  });

  return (
    <>
      <div className="card">
        <div className="card-h">
          <h2><Icon name="arrow-up"/> Contas a Receber</h2>
          <button className="btn primary" onClick={() => {setEditItem(null); setShowForm(true);}}><Icon name="plus"/> Nova Fatura</button>
        </div>
        <div className="filter-row">
          {[['todas','Todas'],['pendentes','Pendentes'],['vencidas','Vencidas'],['recebidas','Recebidas']].map(([k,l]) => (
            <button key={k} className={`filter-btn${filtro===k?' active':''}`} onClick={() => setFiltro(k)}>{l}</button>
          ))}
        </div>
        {sorted.length === 0 ? <div className="empty">Nenhuma conta a receber encontrada.</div> : (
          <div className="tbl-wrap">
            <table className="tbl">
              <thead><tr><th>Cliente / Descrição</th><th>Tipo</th><th>Vencimento</th><th>Valor</th><th>Status</th><th></th></tr></thead>
              <tbody>
                {sorted.map(c => {
                  const st = c._status;
                  const isRecebido = st === 'recebido';
                  return (
                    <tr key={c.id}>
                      <td style={{fontWeight:600}}>{c.cliente}</td>
                      <td><span className={`tipo ${c.tipo||'pedido'}`}>{c.tipo === 'servico' ? 'Serviço' : 'Pedido'}</span></td>
                      <td>{c.vencimento || '—'}</td>
                      <td style={{fontWeight:600, color: isRecebido ? 'var(--muted)' : 'var(--ok)', textDecoration: isRecebido ? 'line-through' : 'none'}}>{fmtBRL(c.valor)}</td>
                      <td><span className={`status ${statusCls(st)}`}><span className={`dot ${statusCls(st)}`}></span> {statusLabel(st)}</span></td>
                      <td><button className="btn sm" onClick={() => {setEditItem(c); setShowForm(true);}}><Icon name="edit" style={{width:13,height:13}}/></button></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
      {showForm && <ContaReceberForm data={editItem} onClose={() => setShowForm(false)} />}
    </>
  );
}

function ContaReceberForm({data, onClose}) {
  const isEdit = !!(data && data.id);
  const empty = {cliente:'', tipo:'pedido', vencimento:'', valor:'', status:'pendente', dataRecebimento:'', observacao:''};
  const [form, setForm] = useState(data ? {...empty,...data, valor: String(data.valor||'')} : empty);
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');
  const set = (k,v) => setForm(f => ({...f,[k]:v}));

  async function save() {
    if (!form.cliente.trim()) {setErr('Informe o cliente.'); return;}
    if (!form.valor || Number(form.valor) <= 0) {setErr('Informe o valor.'); return;}
    setErr(''); setSaving(true);
    try {
      const d = {
        cliente: form.cliente.trim(),
        tipo: form.tipo || 'pedido',
        vencimento: (form.vencimento||'').trim(),
        valor: Number(form.valor) || 0,
        status: form.status || 'pendente',
        dataRecebimento: (form.dataRecebimento||'').trim(),
        observacao: (form.observacao||'').trim(),
      };
      if (isEdit) await db.collection('contas_receber').doc(data.id).update(d);
      else { d.criadoEm = firebase.firestore.FieldValue.serverTimestamp(); await db.collection('contas_receber').add(d); }
      onClose();
    } catch(e) { console.error(e); setErr('Erro ao salvar.'); } finally { setSaving(false); }
  }

  async function remove() {
    if (!window.confirm('Excluir esta fatura?')) return;
    setSaving(true);
    try { await db.collection('contas_receber').doc(data.id).delete(); onClose(); }
    catch(e) { console.error(e); setErr('Erro ao excluir.'); setSaving(false); }
  }

  return (
    <Dialog title={isEdit ? 'Editar Conta a Receber' : 'Nova Fatura a Receber'} onClose={onClose} onSave={save} onDelete={isEdit ? remove : null} saving={saving} err={err}>
      <div className="form">
        <div className="f"><label>Cliente / Descrição *</label><input className="inp" value={form.cliente} onChange={e=>set('cliente',e.target.value)} placeholder="Ex: SEDUC-AM — Pedido #0142"/></div>
        <div className="row2">
          <div className="f">
            <label>Tipo</label>
            <select className="inp" value={form.tipo} onChange={e=>set('tipo',e.target.value)}>
              <option value="pedido">Pedido</option>
              <option value="servico">Serviço</option>
            </select>
          </div>
          <div className="f"><label>Vencimento (dd/mm/aaaa)</label><input className="inp" value={form.vencimento} onChange={e=>set('vencimento',e.target.value)} placeholder="20/11/2026"/></div>
        </div>
        <div className="row2">
          <div className="f"><label>Valor (R$) *</label><input className="inp" type="number" step="0.01" value={form.valor} onChange={e=>set('valor',e.target.value)} placeholder="15800.00"/></div>
          <div className="f">
            <label>Status</label>
            <select className="inp" value={form.status} onChange={e=>set('status',e.target.value)}>
              <option value="pendente">Pendente</option>
              <option value="recebido">Recebido</option>
            </select>
          </div>
        </div>
        <div className="f"><label>Data Recebimento</label><input className="inp" value={form.dataRecebimento} onChange={e=>set('dataRecebimento',e.target.value)} placeholder="dd/mm/aaaa"/></div>
        <div className="f"><label>Observação</label><input className="inp" value={form.observacao} onChange={e=>set('observacao',e.target.value)} placeholder="Notas adicionais"/></div>
      </div>
    </Dialog>
  );
}

/* ── FLUXO DE CAIXA TAB ─────────────────── */
function FluxoCaixaTab() {
  const pagar = useCollection('contas_pagar');
  const receber = useCollection('contas_receber');

  if (pagar.loading || receber.loading) return <div className="loading">Carregando…</div>;

  /* agrupa por mês/ano */
  function mesKey(dateStr) {
    const d = parseDateBR(dateStr);
    if (!d || isNaN(d)) return null;
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }

  const mesesMap = {};

  /* saídas (contas pagas ou com vencimento) */
  pagar.items.forEach(c => {
    const k = mesKey(c.status === 'pago' && c.dataPagamento ? c.dataPagamento : c.vencimento);
    if (!k) return;
    if (!mesesMap[k]) mesesMap[k] = {entradas:0, saidas:0};
    mesesMap[k].saidas += Number(c.valor||0);
  });

  /* entradas (contas recebidas ou com vencimento) */
  receber.items.forEach(c => {
    const k = mesKey(c.status === 'recebido' && c.dataRecebimento ? c.dataRecebimento : c.vencimento);
    if (!k) return;
    if (!mesesMap[k]) mesesMap[k] = {entradas:0, saidas:0};
    mesesMap[k].entradas += Number(c.valor||0);
  });

  /* gera últimos 6 meses ou os meses com dados */
  const now = new Date();
  const allKeys = new Set(Object.keys(mesesMap));
  for (let i = -2; i < 4; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
    allKeys.add(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }
  const sortedKeys = [...allKeys].sort();

  return (
    <div className="card">
      <div className="card-h">
        <h2><Icon name="trending"/> Fluxo de Caixa</h2>
      </div>
      {sortedKeys.length === 0 ? <div className="empty">Cadastre contas a pagar e a receber para visualizar o fluxo.</div> : (
        <div className="fluxo-grid">
          {sortedKeys.map(k => {
            const [y, m] = k.split('-');
            const data = mesesMap[k] || {entradas:0, saidas:0};
            const saldo = data.entradas - data.saidas;
            const hasData = data.entradas > 0 || data.saidas > 0;
            return (
              <div className="fluxo-card" key={k}>
                <div className="mes">{MESES[+m-1]}/{y}</div>
                {hasData ? (
                  <>
                    <div className="entradas">+ {fmtBRL(data.entradas)}</div>
                    <div className="saidas">- {fmtBRL(data.saidas)}</div>
                    <div className={`saldo ${saldo >= 0 ? 'pos' : 'neg'}`}>{fmtBRL(saldo)}</div>
                  </>
                ) : (
                  <>
                    <div className="entradas" style={{opacity:.4}}>+ R$ —</div>
                    <div className="saidas" style={{opacity:.4}}>- R$ —</div>
                    <div className="saldo" style={{color:'var(--muted)'}}>Sem dados</div>
                  </>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ── APP ─────────────────────────────────── */
const TABS = [
  {key:'pagar', label:'Contas a Pagar', icon:'arrow-down'},
  {key:'receber', label:'Contas a Receber', icon:'arrow-up'},
  {key:'fluxo', label:'Fluxo de Caixa', icon:'trending'},
];

function App() {
  const [tab, setTab] = useState('pagar');
  const pagar = useCollection('contas_pagar');
  const receber = useCollection('contas_receber');

  const now = new Date();
  const mesAtual = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

  function isMesAtual(dateStr) {
    const d = parseDateBR(dateStr);
    if (!d || isNaN(d)) return false;
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}` === mesAtual;
  }

  const pagarMes = pagar.items.filter(c => c.status !== 'pago' && isMesAtual(c.vencimento));
  const totalPagarMes = pagarMes.reduce((s,c) => s + Number(c.valor||0), 0);

  const receberMes = receber.items.filter(c => c.status !== 'recebido' && isMesAtual(c.vencimento));
  const totalReceberMes = receberMes.reduce((s,c) => s + Number(c.valor||0), 0);

  const vencidos = [
    ...pagar.items.filter(c => contaStatus(c.vencimento, c.status) === 'vencido'),
    ...receber.items.filter(c => contaStatus(c.vencimento, c.status) === 'vencido'),
  ];
  const totalVencido = vencidos.reduce((s,c) => s + Number(c.valor||0), 0);

  const totalRecebido = receber.items.filter(c => c.status === 'recebido').reduce((s,c) => s + Number(c.valor||0), 0);
  const totalPago = pagar.items.filter(c => c.status === 'pago').reduce((s,c) => s + Number(c.valor||0), 0);
  const saldo = totalRecebido - totalPago;

  return (
    <>
      <Header />
      <main className="wrap">
        <a href={PAINEL_URL} className="back"><Icon name="back"/> Voltar ao Painel</a>
        <div className="page-h">
          <h1>Financeiro</h1>
          <p>Contas a pagar, contas a receber e fluxo de caixa.</p>
        </div>

        <div className="summary-row">
          <div className="summary-card">
            <div className="stripe" style={{background:'var(--accent)'}}></div>
            <div className="label"><Icon name="wallet" style={{width:14,height:14}}/> Saldo Geral</div>
            <div className="value" style={{color: saldo >= 0 ? 'var(--ok)' : 'var(--alert)'}}>{fmtBRL(saldo)}</div>
            <div className="sub">Recebido − Pago</div>
          </div>
          <div className="summary-card">
            <div className="stripe" style={{background:'var(--alert)'}}></div>
            <div className="label"><Icon name="arrow-down" style={{width:14,height:14}}/> A Pagar (mês)</div>
            <div className="value" style={{color:'var(--alert)'}}>{fmtBRL(totalPagarMes)}</div>
            <div className="sub">{pagarMes.length} conta{pagarMes.length !== 1 ? 's' : ''} pendente{pagarMes.length !== 1 ? 's' : ''}</div>
          </div>
          <div className="summary-card">
            <div className="stripe" style={{background:'var(--ok)'}}></div>
            <div className="label"><Icon name="arrow-up" style={{width:14,height:14}}/> A Receber (mês)</div>
            <div className="value" style={{color:'var(--ok)'}}>{fmtBRL(totalReceberMes)}</div>
            <div className="sub">{receberMes.length} fatura{receberMes.length !== 1 ? 's' : ''} pendente{receberMes.length !== 1 ? 's' : ''}</div>
          </div>
          <div className="summary-card">
            <div className="stripe" style={{background: vencidos.length > 0 ? 'var(--warn)' : 'var(--ok)'}}></div>
            <div className="label"><Icon name="alert" style={{width:14,height:14}}/> Vencidos</div>
            <div className="value" style={{color: vencidos.length > 0 ? 'var(--alert)' : 'var(--ok)'}}>{vencidos.length}</div>
            {totalVencido > 0 && <div className="sub">{fmtBRL(totalVencido)} em atraso</div>}
          </div>
        </div>

        <div className="tabs">
          {TABS.map(t => (
            <button key={t.key} className={`tab${tab===t.key?' active':''}`} onClick={() => setTab(t.key)}>
              <Icon name={t.icon} style={{width:14,height:14,marginRight:6,verticalAlign:'middle'}}/> {t.label}
            </button>
          ))}
        </div>

        {tab === 'pagar' && <ContasPagarTab />}
        {tab === 'receber' && <ContasReceberTab />}
        {tab === 'fluxo' && <FluxoCaixaTab />}
      </main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Administrativo - Novari Print</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel" src="auth-gate.js"></script>
<script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<style>
:root{
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --navy:#151F38; --red:#CE1B21; --blue:#66B2E5;
  --c-blue:#2E86C7; --c-sky:#2E9BD6; --c-green:#1E9E6A; --c-red:#CE1B21; --c-amber:#B4791A; --c-violet:#6D54C8;
  --side-bg:#151F38; --side-ink:#EEF2FB; --side-muted:#93A0C0;
  --side-active:rgba(206,27,33,.16); --side-hover:rgba(255,255,255,.06); --side-line:rgba(255,255,255,.09);
  --bg:#F3F4F7; --surface:#FFFFFF; --col:#EEF0F5; --hover:#F3F5F9;
  --ink:#111B33; --ink-2:#4B5673; --muted:#6B7690;
  --line:#E2E6EE; --line-strong:#CFD6E2;
  --brand:#151F38; --brand-ink:#FFFFFF; --accent:#2E86C7; --brand-red:#CE1B21; --brand-blue:#66B2E5;
  --alert:#B42318; --alert-bg:#FEF0EE; --warn:#A54A08; --warn-bg:#FDF3E7; --ok:#067647; --ok-bg:#E8F6EF;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --side-bg:#111A30;
  --bg:#0C1220; --surface:#151C2E; --col:#1A2238; --hover:#1C2540;
  --ink:#E8ECF5; --ink-2:#AEB8CE; --muted:#8B96AE;
  --line:#242D44; --line-strong:#34405C;
  --brand:#E8ECF5; --brand-ink:#0D1322; --accent:#66B2E5; --brand-red:#FF6B61; --brand-blue:#66B2E5;
  --alert:#FF8F80; --alert-bg:#331A18; --warn:#F2B25A; --warn-bg:#2E2212; --ok:#5BD29A; --ok-bg:#122A22;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --side-bg:#111A30;
  --bg:#0C1220; --surface:#151C2E; --col:#1A2238; --hover:#1C2540;
  --ink:#E8ECF5; --ink-2:#AEB8CE; --muted:#8B96AE;
  --line:#242D44; --line-strong:#34405C;
  --brand:#E8ECF5; --brand-ink:#0D1322; --accent:#66B2E5; --brand-red:#FF6B61; --brand-blue:#66B2E5;
  --alert:#FF8F80; --alert-bg:#331A18; --warn:#F2B25A; --warn-bg:#2E2212; --ok:#5BD29A; --ok-bg:#122A22;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--line);border-top:3px solid var(--brand-red)}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;background:none;border:0;padding:0}
.logo-img{height:38px;width:auto;display:block}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.2;color:var(--ink);text-align:left}
.brand-sub{color:var(--muted);font-size:12.5px;text-align:left}

.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink-2);font-size:13px;font-weight:500;cursor:pointer;padding:0;margin-bottom:10px}
.back:hover{color:var(--ink)}
.page-h{margin:0 0 20px}
.page-h h1{margin:0 0 4px;font-size:20px;font-weight:700;letter-spacing:-.01em}
.page-h p{margin:0;color:var(--muted);font-size:13px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);color:var(--ink);font-weight:500;font-size:13.5px;cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.danger{color:var(--alert);border-color:var(--alert)}
.btn.danger:hover{background:var(--alert-bg)}
.btn.sm{height:30px;font-size:12px;padding:0 10px}
.btn[disabled]{opacity:.5;cursor:default}

/* Summary */
.summary-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.summary-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.summary-card .label{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.summary-card .value{font-size:22px;font-weight:700;letter-spacing:-.02em}
.summary-card .sub{font-size:12px;color:var(--muted);margin-top:4px}

/* Tabs */
.tabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:20px;gap:0;overflow-x:auto}
.tab{padding:10px 18px;border:0;background:none;color:var(--muted);font-weight:600;font-size:13.5px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* Card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card-h h2{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}

/* Info grid (Empresa) */
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.info-item label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;font-weight:500}
.info-item span{font-size:14px;font-weight:500}

/* Table */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--line);color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:var(--hover)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:20px}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.status.warn{background:var(--warn-bg);color:var(--warn)}
.status.alert{background:var(--alert-bg);color:var(--alert)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.ok{background:var(--ok)}
.dot.warn{background:var(--warn)}
.dot.alert{background:var(--alert)}

/* Doc list */
.doc-list{display:flex;flex-direction:column;gap:8px}
.doc-item{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:8px}
.doc-item:hover{border-color:var(--line-strong)}
.doc-icon{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;flex:none}
.doc-icon.pdf{background:#FEF1EF;color:#B42318}
.doc-icon.file{background:#EFF6FF;color:#1E40AF}
@media (prefers-color-scheme:dark){
  .doc-icon.pdf{background:#3A1B18;color:#FF8F80}
  .doc-icon.file{background:#172544;color:#93C5FD}
}
.doc-info{flex:1;min-width:0}
.doc-info h4{margin:0 0 2px;font-size:14px;font-weight:600}
.doc-info p{margin:0;font-size:12px;color:var(--muted)}

/* Patrimônio */
.pat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pat-card{border:1px solid var(--line);border-radius:10px;padding:16px}
.pat-card:hover{border-color:var(--line-strong)}
.pat-card h4{margin:0 0 8px;font-size:14.5px;font-weight:600}
.pat-meta{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);margin-bottom:10px}
.pat-val{font-size:18px;font-weight:700;color:var(--accent)}

/* Dialog */
.ov{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(9,14,28,.55)}
.dlg{width:520px;max-width:100%;max-height:92vh;overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px 10px}
.dlg-h h2{margin:0;font-size:16px;font-weight:700}
.dlg-b{padding:6px 22px 18px}
.dlg-f{display:flex;gap:8px;justify-content:space-between;padding:14px 22px;border-top:1px solid var(--line)}
.dlg-f .right{display:flex;gap:8px}
.x{width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:6px;background:none;color:var(--muted);cursor:pointer;flex:none}
.x:hover{background:var(--hover);color:var(--ink)}
.form{display:grid;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label{display:block;margin-bottom:5px;font-weight:600;font-size:12.5px;color:var(--ink-2)}
.inp{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink);font-size:14px}
.inp:focus{border-color:var(--accent);outline:none}
select.inp{appearance:auto}
.err{color:var(--alert);font-size:12.5px;margin:-4px 0 0}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.loading{color:var(--muted);padding:30px 0;text-align:center}

@media (max-width:820px){.row2{grid-template-columns:1fr}}
@media (max-width:600px){.summary-row{grid-template-columns:1fr 1fr}}

/* PDF import */
.pdf-import{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px;border:1px dashed var(--line-strong);border-radius:8px;background:var(--hover);margin-bottom:4px;transition:border-color .12s,background .12s}
.pdf-import.drag{border-color:var(--accent);background:var(--ok-bg)}
.pdf-import .txt{flex:1;min-width:160px}
.pdf-import .txt strong{display:block;font-size:13px;font-weight:600}
.pdf-import .txt span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.pdf-import input[type=file]{display:none}
.pdf-note{font-size:12.5px;margin:2px 0 0;padding:8px 10px;border-radius:6px;width:100%}
.pdf-note.ok{background:var(--ok-bg);color:var(--ok)}
.pdf-note.warn{background:var(--warn-bg);color:var(--warn)}
.pdf-link{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none}
.pdf-link:hover{text-decoration:underline}
.pdf-view-btn{flex:none;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);color:var(--ink-2)}
.pdf-view-btn:hover{background:var(--hover);color:var(--ink)}

/* Soltar PDFs na aba */
.sd-drop{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:20px;border:2px dashed var(--line-strong);border-radius:12px;background:var(--hover);margin-bottom:16px;transition:border-color .12s,background .12s}
.sd-drop.hot{border-color:var(--accent);background:var(--info-bg)}
.sd-ico{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);flex:none}
.sd-ico .ic{width:22px;height:22px}
.sd-t{flex:1;min-width:200px}
.sd-t strong{display:block;font-size:14.5px}
.sd-t span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.sd-rev{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;display:grid;gap:10px}
.sd-rev-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sd-pdfi{width:34px;height:34px;border-radius:8px;background:var(--alert-bg);color:var(--alert);display:grid;place-items:center;flex:none}
.sd-n{flex:1;min-width:140px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.sd-n b{display:block;font-size:14px;color:var(--ink)}
.sd-chip{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px}
.sd-chip.warn{background:var(--warn-bg);color:var(--warn)}
.sd-chip.blue{background:var(--info-bg);color:var(--accent)}
.sd-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sd-fields label{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:3px}
.sd-tip{font-size:12px;color:var(--muted)}
.sd-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.cnae-list{margin:0;padding:10px;list-style:none;display:grid;gap:4px;font-size:13px;color:var(--ink-2);max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:8px}

/* ===== Casca padrão Novari (sidebar + topbar) ===== */
.side{position:fixed;left:0;top:0;bottom:0;width:238px;z-index:30;background:var(--side-bg);color:var(--side-ink);
  display:flex;flex-direction:column;gap:4px;padding:16px 12px calc(16px + env(safe-area-inset-bottom,0px));
  border-right:1px solid var(--side-line);overflow-y:auto}
.side-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;text-decoration:none}
.side-brand img{height:34px;width:auto;display:block;background:#fff;border-radius:8px;padding:3px}
.side-brand .nm{font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.15;color:var(--side-ink)}
.side-brand .sb{font-size:11.5px;color:var(--side-muted);letter-spacing:.03em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .lab{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);padding:12px 10px 4px}
.navi{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--side-ink);
  text-decoration:none;font-size:13.5px;font-weight:500;position:relative;opacity:.86;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.navi:hover{background:var(--side-hover);opacity:1}
.navi.active{background:var(--side-active);opacity:1;font-weight:600}
.navi.active::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--red)}
.navi.soon{opacity:.5;cursor:default}.navi.soon:hover{background:none}
.navi .ic{width:17px;height:17px;opacity:.95}
body{padding-left:238px}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--surface);
  border-bottom:1px solid var(--line);border-top:3px solid var(--red);position:sticky;top:0;z-index:10;
  padding-top:calc(12px + env(safe-area-inset-top,0px))}
.tb-search{flex:1;min-width:0;max-width:440px;display:flex;align-items:center;gap:9px;background:var(--col);
  border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted)}
.tb-search input{border:0;background:transparent;color:var(--ink);font-size:13.5px;width:100%;outline:none}
.tb-search input::placeholder{color:var(--muted)}
.tb-search .ic{width:16px;height:16px}
.tb-sp{flex:1}
.ib{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;color:var(--ink-2);background:transparent;border:1px solid transparent;cursor:pointer;position:relative}
.ib:hover{background:var(--hover);border-color:var(--line)}
.ib .ic{width:18px;height:18px}
.ib .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid var(--surface)}
.tb-user{display:flex;align-items:center;gap:10px;padding-left:2px}
.tb-ava{width:38px;height:38px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.tb-user .un{font-weight:600;font-size:13.5px;line-height:1.15}
.tb-user .ur{font-size:11.5px;color:var(--muted)}
.theme-moon,.theme-sun{display:none}
:root:not([data-theme]) .theme-moon{display:block}
@media (prefers-color-scheme:dark){ :root:not([data-theme]) .theme-moon{display:none} :root:not([data-theme]) .theme-sun{display:block} }
:root[data-theme="light"] .theme-moon{display:block}
:root[data-theme="dark"] .theme-sun{display:block}
.back{display:none!important}
@media (max-width:820px){
  body{padding-left:0}
  .side{position:static;width:auto;flex-direction:row;align-items:center;gap:8px;overflow-x:auto;padding:10px 12px;border-right:0;border-bottom:1px solid var(--side-line)}
  .side-brand{padding:0 8px 0 2px;border-right:1px solid var(--side-line);margin-right:4px}
  .side-brand .sb{display:none}
  .nav{flex-direction:row;gap:4px}
  .nav .lab{display:none}
  .navi{white-space:nowrap;padding:8px 11px;width:auto}
  .navi.active::before{display:none}
  .navi.active{box-shadow:inset 0 -2px 0 var(--red)}
}
@media (max-width:520px){ .topbar{flex-wrap:wrap} .tb-search{order:3;max-width:none;flex-basis:100%} .tb-user .un,.tb-user .ur{display:none} }

</style>
</head>

/* ── Helpers ─────────────────────────────── */
function fmtDate(d) {
  if (!d) return '—';
  if (d.toDate) d = d.toDate();
  if (typeof d === 'string') d = new Date(d);
  const dd = String(d.getDate()).padStart(2,'0');

  return `${dd}/${mm}/${d.getFullYear()}`;

function parseDateBR(s) {
  if (!s) return null;
  const p = s.split('/');
  if (p.length === 3) return new Date(+p[2], +p[1]-1, +p[0]);
  return new Date(s);
}
function diasAte(dateStr) {
  if (!dateStr) return 999;
  const d = parseDateBR(dateStr);
  if (isNaN(d)) return 999;
  return Math.ceil((d - new Date()) / 86400000);
}
function certStatus(validade) {

/* ── Leitura de PDF (Cartão CNPJ) ────────── */
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
}

// Extrai linhas do PDF preservando a posição horizontal (x) de cada item,
// necessário porque o Cartão CNPJ tem várias colunas na mesma altura
// (ex: "LOGRADOURO | NÚMERO | COMPLEMENTO" com os valores também lado a lado).
async function extractPdfRows(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  const rows = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const byY = {};
    content.items.forEach(it => {
      const str = it.str;
      if (!str || !str.trim()) return;
      const y = Math.round(it.transform[5] / 3) * 3; // agrupa itens próximos na mesma linha
      if (!byY[y]) byY[y] = [];
      byY[y].push({str, x: it.transform[4]});
    });
    Object.keys(byY).map(Number).sort((a,b) => b - a).forEach(y => {
      rows.push({ y, items: byY[y].sort((a,b) => a.x - b.x) });
    });
  }
  return rows;
}

function rowText(row) {
  return row.items.map(it => it.str).join(' ').replace(/\s+/g,' ').trim();
}

// Dado um conjunto de rótulos esperados na MESMA linha, devolve a posição x de cada um
// (usado como fronteira de coluna para separar os valores da linha seguinte).
function colBoundaries(row, labelDefs) {
  const found = [];
  labelDefs.forEach(({key, re}) => {
    const it = row.items.find(i => re.test(i.str.trim()));
    if (it) found.push({key, x: it.x});
  });
  return found.sort((a,b) => a.x - b.x);
}

// Distribui os itens de uma linha de valores entre as colunas, pela posição x mais próxima.
function splitByBoundaries(row, boundaries) {
  const out = {};
  boundaries.forEach(b => out[b.key] = []);
  row.items.forEach(it => {
    let assigned = boundaries[0];
    boundaries.forEach(b => { if (it.x >= b.x - 10) assigned = b; });
    out[assigned.key].push(it.str);
  });
  Object.keys(out).forEach(k => out[k] = out[k].join(' ').replace(/\s+/g,' ').trim());
  return out;
}

function parseCartaoCNPJ(rows) {
  const full = rows.map(rowText).join('\n');
  const out = {};
  const tmp = {};

  const cnpjMatch = full.match(/\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/);
  if (cnpjMatch) out.cnpj = cnpjMatch[0];

  for (let i = 0; i < rows.length; i++) {
    const t = rowText(rows[i]);
    const next = rows[i + 1];

    if (!out.razaoSocial && /^NOME EMPRESARIAL/i.test(t) && next) {
      out.razaoSocial = rowText(next);
    }

    if (!out.nomeFantasia && /T[ÍI]TULO DO ESTABELECIMENTO/i.test(t) && next) {
      const b = colBoundaries(rows[i], [{key:'nome', re:/T[ÍI]TULO/i}, {key:'porte', re:/^PORTE$/i}]);
      if (b.length >= 2) {
        const parts = splitByBoundaries(next, b);
        if (parts.nome) out.nomeFantasia = parts.nome;
        if (parts.porte) out.porte = parts.porte;
      } else {
        out.nomeFantasia = rowText(next);
      }
    }

    if (!out.cnae && /C[ÓO]DIGO E DESCRI[ÇC][ÃA]O DA ATIVIDADE ECON[ÔO]MICA PRINCIPAL/i.test(t) && next) {
      out.cnae = rowText(next);
    }

    if (!tmp.enderecoRow && /^LOGRADOURO/i.test(t) && /N[ÚU]MERO/i.test(t) && next) {
      const b = colBoundaries(rows[i], [{key:'log', re:/^LOGRADOURO$/i}, {key:'num', re:/^N[ÚU]MERO$/i}, {key:'comp', re:/^COMPLEMENTO/i}]);
      if (b.length >= 2) {
        const parts = splitByBoundaries(next, b);
        tmp.logradouro = parts.log || '';
        tmp.numero = parts.num || '';
        tmp.complemento = parts.comp || '';
      }
      tmp.enderecoRow = true;
      // 2ª linha do complemento (ex: "SALA 05"): linha seguinte com itens só na coluna do complemento
      const compB = b.find(x => x.key === 'comp');
      const after = rows[i + 2];
      if (compB && after && after.items.length && after.items.every(it => it.x >= compB.x - 10) && !/^(CEP|ENDERE)/i.test(rowText(after))) {
        tmp.complemento = [tmp.complemento, rowText(after)].filter(Boolean).join(' ');
      }
    }

    if (!out.dataAbertura && /DATA DE ABERTURA/i.test(t)) {
      // a data fica logo abaixo do rótulo (mesma coluna), às vezes misturada com a linha do CNPJ
      const lab = rows[i].items.find(it => /DATA DE ABERTURA/i.test(it.str));
      for (let k = 1; k <= 3 && !out.dataAbertura; k++) {
        const r = rows[i + k];
        const it = r && lab && r.items.find(x => /^\d{2}\/\d{2}\/\d{4}$/.test(x.str.trim()) && Math.abs(x.x - lab.x) < 40);
        if (it) out.dataAbertura = it.str.trim();
      }
    }

    if (!out.naturezaJuridica && /NATUREZA JUR[ÍI]DICA/i.test(t) && next) {
      out.naturezaJuridica = rowText(next);
    }

    if (!tmp.sitRow && /^SITUA[ÇC][ÃA]O CADASTRAL/i.test(t) && next) {
      const b = colBoundaries(rows[i], [{key:'sit', re:/^SITUA[ÇC][ÃA]O$|^SITUA[ÇC][ÃA]O CADASTRAL$/i}, {key:'data', re:/^DATA DA SITUA/i}]);
      if (b.length >= 2) {
        const parts = splitByBoundaries(next, b);
        if (parts.sit) out.situacaoCadastral = parts.sit;
        if (parts.data) out.dataSituacao = parts.data;
      } else {
        out.situacaoCadastral = rowText(next);
      }
      tmp.sitRow = true;
    }

    if (!tmp.cepRow && /^CEP/i.test(t) && /BAIRRO/i.test(t) && next) {
      const b = colBoundaries(rows[i], [{key:'cep', re:/^CEP$/i}, {key:'bairro', re:/BAIRRO/i}, {key:'municipio', re:/MUNIC[ÍI]PIO/i}, {key:'uf', re:/^UF$/i}]);
      if (b.length >= 2) {
        const parts = splitByBoundaries(next, b);
        tmp.cep = parts.cep || '';
        tmp.bairro = parts.bairro || '';
        tmp.municipio = parts.municipio || '';
        tmp.uf = parts.uf || '';
      }
      tmp.cepRow = true;
    }

    if (!tmp.contatoRow && /ENDERE[ÇC]O ELETR[ÔO]NICO/i.test(t) && next) {
      const b = colBoundaries(rows[i], [{key:'email', re:/ELETR[ÔO]NICO/i}, {key:'tel', re:/^TELEFONE$/i}]);
      if (b.length >= 2) {
        const parts = splitByBoundaries(next, b);
        if (parts.email) out.email = parts.email;
        if (parts.tel) out.telefone = parts.tel;
      } else {
        const vt = rowText(next);
        if (vt.includes('@')) out.email = vt; else out.telefone = vt;
      }
      tmp.contatoRow = true;
    }
  }

  // Atividades secundárias (várias linhas; as que quebram de linha começam em minúscula)
  const sec = [];
  let inSec = false, lastItem = false;
  rows.forEach(r => {
    const t = rowText(r);
    if (/ATIVIDADES ECON[ÔO]MICAS SECUND[ÁA]RIAS/i.test(t)) { inSec = true; lastItem = false; return; }
    if (/NATUREZA JUR[ÍI]DICA/i.test(t)) { inSec = false; lastItem = false; return; }
    if (!inSec) return;
    if (/^\d{2}\.\d{2}-\d-\d{2}\s*-/.test(t)) { sec.push(t); lastItem = true; }
    else if (lastItem && /^[a-zà-ú]/.test(t)) { sec[sec.length - 1] += ' ' + t; }
    else lastItem = false;
  });
  if (sec.length) out.atividadesSecundarias = sec.join('\n');

  const endereco = [
    tmp.logradouro,
    tmp.numero && `nº ${tmp.numero}`,
    tmp.complemento,
    tmp.bairro,
    [tmp.municipio, tmp.uf].filter(Boolean).join(' - '),
    tmp.cep && `CEP ${tmp.cep}`,
  ].filter(Boolean).join(', ');
  if (endereco) out.endereco = endereco;

  Object.keys(out).forEach(k => {
    if (!out[k] || /^\*+$/.test(out[k]) || (k !== 'atividadesSecundarias' && out[k].length > 160)) delete out[k];
  });
  return out;
}

/* ── Leitura exata por tipo de documento ───────────────── */
const DATE_RE = /\d{2}\/\d{2}\/\d{4}/;

function addDays(ddmmyyyy, n) {
  const [d, m, y] = ddmmyyyy.split('/').map(Number);
  const dt = new Date(y, m - 1, d + n);
  return String(dt.getDate()).padStart(2, '0') + '/' + String(dt.getMonth() + 1).padStart(2, '0') + '/' + dt.getFullYear();
}

// Data no nome do arquivo (ex: "...31.03.27.pdf", "...02-02-2027.pdf") — só como último recurso para a validade.
function dateFromFilename(filename) {
  const base = String(filename || '').replace(/\.pdf$/i, '');
  let m = base.match(/(\d{2})[.\-_](\d{2})[.\-_](\d{4})(?!\d)/);
  if (m) return `${m[1]}/${m[2]}/${m[3]}`;
  m = base.match(/(\d{2})[.\-_](\d{2})[.\-_](\d{2})(?!\d)/);
  if (m) return `${m[1]}/${m[2]}/20${m[3]}`;
  return null;
}

function firstDateAfter(text, labelRe, span = 120) {
  const m = labelRe.exec(text);
  if (!m) return null;
  const d = text.slice(m.index + m[0].length, m.index + m[0].length + span).match(DATE_RE);
  return d ? d[0] : null;
}

// Identifica o tipo do documento pelo conteúdo (e, se o texto do PDF for ilegível, pelo nome do arquivo).
function classifyDoc(text, filename) {
  const T = (text || '').replace(/\s+/g, ' ').toUpperCase();
  const F = (filename || '').toUpperCase();
  if (/COMPROVANTE DE INSCRI[ÇC][ÃA]O E DE SITUA/.test(T)) return 'cnpj';
  if (/CART[ÃA]O DE INSCRI[ÇC][ÃA]O MUNICIPAL/.test(T)) return 'im';
  if (/TRIBUTOS FEDERAIS/.test(T) && /D[ÍI]VIDA ATIVA DA UNI[ÃA]O/.test(T)) return 'cnd-federal';
  if (/D[ÉE]BITOS TRABALHISTAS/.test(T)) return 'cndt';
  if (/CERTIFICADO DE REGULARIDADE DO FGTS/.test(T)) return 'fgts';
  if (/SECRETARIA DE ESTADO DA FAZENDA/.test(T) && /CERTID[ÃA]O NEGATIVA/.test(T)) return 'cnd-sefaz';
  const Tn = T.replace(/ /g, ''); // alguns PDFs (TJAM) vêm com letras espaçadas
  if (/FAL[ÊE]NCIA/.test(Tn) && /RECUPERA/.test(Tn)) return 'falencia';
  if (/TRIBUTOS MUNICIPAIS/.test(T)) return 'cnd-municipal';
  if (/SENATRAN|MINIST[ÉE]RIO DOS TRANSPORTES/.test(T) || /\bCNH\b/.test(F)) return 'cnh';
  if (/JUNTA COMERCIAL/.test(T) && /CONTRATO/.test(T) || /CONTRATO[ _-]*SOCIAL/.test(F)) return 'contrato';
  if (/BALAN.{1,2}O/.test(F) || /BALAN[ÇC]O PATRIMONIAL/.test(T)) return 'balanco';
  if (/INSCRI.{0,3}O.{0,2}ESTADUAL/.test(F) || /INSCRI[ÇC][ÃA]O ESTADUAL/.test(T)) return 'ie';
  if (/ALVAR[ÁA]|LICEN[ÇC]A DE (FUNCIONAMENTO|OPERA)/.test(T + ' ' + F)) return 'licenca';
  return 'desconhecido';
}

// Qual aba recebe cada tipo.
const KIND_INFO = {
  'cnpj':          {tab:'empresa',    label:'Cartão CNPJ'},
  'im':            {tab:'documentos',    label:'Cartão de Inscrição Municipal'},
  'ie':            {tab:'certidoes',    label:'Cartão de Inscrição Estadual'},
  'cnd-federal':   {tab:'certidoes',  label:'CND Federal (Receita Federal / PGFN)'},
  'cndt':          {tab:'certidoes',  label:'CNDT - Débitos Trabalhistas'},
  'fgts':          {tab:'certidoes',  label:'CRF - FGTS (Caixa)'},
  'cnd-sefaz':     {tab:'certidoes',  label:'CND Estadual (SEFAZ-AM)'},
  'falencia':      {tab:'certidoes',  label:'Certidão de Falência e Recuperação Judicial (TJAM)'},
  'cnd-municipal': {tab:'certidoes',  label:'CND Municipal (SEMEF Manaus)'},
  'contrato':      {tab:'documentos', label:'Contrato Social Consolidado'},
  'balanco':       {tab:'documentos', label:'Balanço Patrimonial'},
  'cnh':           {tab:'documentos', label:'CNH-e (sócio/representante)'},
  'licenca':       {tab:'licencas',   label:'Licença'},
};

// Certidões: devolve {nome, emissao, validade}.
function parseCertidao(kind, text, filename) {
  const out = {nome: (KIND_INFO[kind] || {}).label || ''};
  const t = text.replace(/[ \t]+/g, ' ');
  if (kind === 'cnd-federal') {
    out.emissao = firstDateAfter(t, /Emitida[^\n]{0,60}?do dia/i, 30);
    out.validade = firstDateAfter(t, /V[áa]lida at[ée]/i, 30);
    if (/POSITIVA COM EFEITOS/i.test(t)) out.nome = 'CND Federal (Positiva com Efeitos de Negativa)';
  } else if (kind === 'cndt') {
    out.emissao = firstDateAfter(t, /Expedi[çc][ãa]o:/i, 30);
    out.validade = firstDateAfter(t, /Validade:/i, 30);
  } else if (kind === 'fgts') {
    const m = t.match(/Validade:\s*(\d{2}\/\d{2}\/\d{4})\s*a\s*(\d{2}\/\d{2}\/\d{4})/i);
    if (m) { out.emissao = m[1]; out.validade = m[2]; }
  } else if (kind === 'cnd-sefaz') {
    out.emissao = firstDateAfter(t, /\bData:/, 20);
    out.validade = firstDateAfter(t, /V[áa]lida at[ée]:/i, 20);
  } else if (kind === 'falencia') {
    out.emissao = firstDateAfter(t, /anteriores\s+[àa]\s+data\s+de/i, 20);
    const dias = t.match(/validade de (\d+) dias/i);
    if (out.emissao && dias) out.validade = addDays(out.emissao, parseInt(dias[1], 10));
  } else if (kind === 'cnd-municipal') {
    out.validade = firstDateAfter(t, /V[ÁA]LIDA AT[ÉE]/i, 20);
    out.emissao = firstDateAfter(t, /Cadastrado em:/i, 20);
  }
  if (kind === 'cnd-sefaz') { const ie = t.match(/Inscri[çc][ãa]o:\s*([\d.\-]+)/i); if (ie) out.empresa = {ie: ie[1]}; }
  if (kind === 'cnd-municipal') { const im = t.match(/INSCRI[ÇC][ÃA]O MUNICIPAL\s*:\s*(\d+)/i); if (im) out.empresa = {im: im[1]}; }
  if (!out.validade) out.validade = dateFromFilename(filename);
  Object.keys(out).forEach(k => { if (!out[k]) delete out[k]; });
  return out;
}

// Documentos: nome sugerido + tipo/formato.
function parseDocumento(kind, text, filename) {
  const out = {nome: (KIND_INFO[kind] || {}).label || '', tipo: '', formato: 'PDF'};
  const base = String(filename || '').replace(/\.pdf$/i, '');
  if (kind === 'balanco') {
    const m = base.match(/(\d{4})\D{1,3}(\d{4})/);
    out.nome = m ? `Balanço Patrimonial ${m[1]}/${m[2]}` : 'Balanço Patrimonial';
    out.tipo = 'Contábil';
  } else if (kind === 'contrato') {
    out.tipo = 'Societário';
  } else if (kind === 'cnh') {
    out.tipo = 'Identificação';
  } else if (kind === 'im') {
    out.tipo = 'Fiscal';
    const d = firstDateAfter(text, /Data da Expedi[çc][ãa]o:/i, 20);
    if (d) out.dataAtualizacao = d;
  }
  return out;
}

// Cartões IM / IE: dados para a aba Empresa.
function parseCartaoMunicipal(text) {
  const out = {};
  const im = text.match(/Inscri[çc][ãa]o Municipal:\s*(\d+)/i);
  if (im) out.im = im[1];
  return out;
}

/* ── Armazenamento de PDFs (Firestore, plano gratuito) ───────────── */
// Os PDFs ficam na coleção "arquivos" (sem usar o Firebase Storage, que exige plano pago).
// Cada arquivo é dividido em pedaços (subcoleção "partes") porque o Firestore limita cada
// documento a ~1 MB. Tamanho máximo por PDF: 5 MB.
const CHUNK_BYTES = 600 * 1024;
const MAX_PDF_BYTES = 5 * 1024 * 1024;

function fmtFileSize(bytes) {
  if (!bytes) return '';
  const mb = bytes / 1048576;
  if (mb >= 1) return mb.toFixed(1).replace('.0','') + ' MB';
  return Math.max(1, Math.round(bytes / 1024)) + ' KB';
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1] || '');
    r.onerror = () => reject(r.error);
    r.readAsDataURL(blob);
  });
}

function friendlyError(msg) { const e = new Error(msg); e.friendly = true; return e; }

async function uploadPdfToStorage(file, folder) {
  if (file.size > MAX_PDF_BYTES) {
    throw friendlyError(`PDF muito grande (${fmtFileSize(file.size)}). O limite é ${fmtFileSize(MAX_PDF_BYTES)}. Comprima o arquivo e tente de novo.`);
  }
  const total = Math.max(1, Math.ceil(file.size / CHUNK_BYTES));
  const chunks = [];
  for (let i = 0; i < total; i++) {
    chunks.push(await blobToBase64(file.slice(i * CHUNK_BYTES, (i + 1) * CHUNK_BYTES)));
  }
  const fileRef = db.collection('arquivos').doc();
  const batch = db.batch();
  batch.set(fileRef, {
    nome: file.name, pasta: folder, tamanho: fmtFileSize(file.size), bytes: file.size,
    tipo: 'application/pdf', partes: total,
    criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
  });
  chunks.forEach((data, i) => batch.set(fileRef.collection('partes').doc(String(i).padStart(3, '0')), {i, data}));
  await Promise.race([
    batch.commit(),
    new Promise((_, rej) => setTimeout(() => rej(friendlyError('O envio não respondeu a tempo. Verifique a conexão e tente novamente.')), 45000)),
  ]);
  return {id: fileRef.id, nome: file.name, tamanho: fmtFileSize(file.size)};
}

// Abre o PDF guardado: junta os pedaços e mostra numa nova aba.
async function openPdf(e, id) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  if (!id) return;
  const w = window.open('', '_blank');
  try {
    const fileRef = db.collection('arquivos').doc(id);
    const snap = await fileRef.get();
    if (!snap.exists) throw new Error('not found');
    const meta = snap.data();
    const b64parts = meta.data
      ? [meta.data] // formato antigo (arquivo inteiro no próprio documento)
      : (await fileRef.collection('partes').orderBy('i').get()).docs.map(d => d.data().data);
    const blobParts = b64parts.map(b64 => {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    });
    const url = URL.createObjectURL(new Blob(blobParts, {type: 'application/pdf'}));
    if (w) w.location.href = url; else window.location.href = url;
  } catch (err) {
    console.error(err);
    if (w) w.close();
    alert('Não foi possível abrir o PDF.');
  }
}

// Procura uma data (dd/mm/aaaa) próxima de alguma das palavras-chave dadas
// (ex: "VALIDADE", "VENCIMENTO"), olhando a mesma linha e a linha seguinte.
function findDateNearKeywords(text, keywords) {
  const lines = text.split('\n');
  const dateRe = /\d{2}\/\d{2}\/\d{4}/;
  for (let i = 0; i < lines.length; i++) {
    const up = lines[i].toUpperCase();
    if (keywords.some(k => up.includes(k))) {
      let m = lines[i].match(dateRe);
      if (m) return m[0];
      if (lines[i+1]) { m = lines[i+1].match(dateRe); if (m) return m[0]; }
    }
  }
  return null;
}

function findAllDates(text) {
  return (text.match(/\d{2}\/\d{2}\/\d{4}/g) || []);
}

function guessOrgao(text) {
  const T = text.toUpperCase();
  if (T.includes('PREFEITURA MUNICIPAL DE MANAUS') || T.includes('PREFEITURA DE MANAUS')) return 'Prefeitura de Manaus';
  if (T.includes('CORPO DE BOMBEIROS')) return 'Corpo de Bombeiros';
  if (T.includes('VIGILÂNCIA SANITÁRIA')) return 'Vigilância Sanitária';
  if (T.includes('SEFAZ') || T.includes('SECRETARIA DE ESTADO DA FAZENDA')) return 'SEFAZ-AM';
  if (T.includes('IPAAM') || T.includes('MEIO AMBIENTE')) return 'IPAAM';
  if (T.includes('RECEITA FEDERAL')) return 'Receita Federal';
  return null;
}

function suggestNomeFromFile(filename) {
  return filename.replace(/\.pdf$/i, '').replace(/[_\-]+/g, ' ').replace(/\s+/g,' ').trim();
}

// Área de arrastar/soltar ou selecionar um PDF: guarda no Firestore e
// devolve o texto extraído para quem usa (cada formulário decide o que preencher).
function PdfDropZone({folder, label, onResult}) {
  const [busy, setBusy] = useState(false);
  const [drag, setDrag] = useState(false);
  const [note, setNote] = useState(null);

  async function handleFile(file) {
    if (!file) return;
    if (!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) {
      setNote({ok:false, msg:'Selecione um arquivo PDF.'});
      return;
    }
    setBusy(true); setNote(null);
    try {
      let rows = [];
      try { rows = await extractPdfRows(file); } catch(e) { console.error('Falha ao ler texto do PDF', e); }
      const text = rows.map(rowText).join('\n');
      const uploaded = await uploadPdfToStorage(file, folder);
      onResult({file, uploaded, text, rows});
      setNote({ok:true, msg:`"${file.name}" anexado e analisado.`});
    } catch(e) {
      console.error(e);
      const friendly = (e && e.friendly) ? e.message : 'Erro ao enviar o PDF. Verifique a conexão e tente novamente.';
      setNote({ok:false, msg:friendly});
    } finally { setBusy(false); }
  }

  return (
    <div
      className={`pdf-import${drag ? ' drag' : ''}`}
      onDragOver={e => { e.preventDefault(); setDrag(true); }}
      onDragLeave={() => setDrag(false)}
      onDrop={e => { e.preventDefault(); setDrag(false); handleFile(e.dataTransfer.files && e.dataTransfer.files[0]); }}
    >
      <div className="txt">
        <strong>{label || 'Arraste o PDF para cá'}</strong>
        <span>ou clique para selecionar — o arquivo é anexado e os campos abaixo são sugeridos automaticamente.</span>
      </div>
      <label className="btn sm" style={{cursor:'pointer'}}>
        {busy ? 'Enviando…' : <><Icon name="file"/> Selecionar PDF</>}
        <input type="file" accept="application/pdf" disabled={busy} onChange={e => { const f = e.target.files && e.target.files[0]; e.target.value=''; handleFile(f); }}/>
      </label>
      {note && <p className={`pdf-note ${note.ok ? 'ok' : 'warn'}`}>{note.msg}</p>}
    </div>
  );
}

/* ── Limpeza de PDFs órfãos ───────────────── */
// Apaga um PDF guardado (manifesto + pedaços).
async function deleteArquivo(id) {
  if (!id) return;
  try {
    const ref = db.collection('arquivos').doc(id);
    const parts = await ref.collection('partes').get();
    const batch = db.batch();
    parts.docs.forEach(d => batch.delete(d.ref));
    batch.delete(ref);
    await batch.commit();
  } catch (e) { console.error('Falha ao apagar PDF', id, e); }
}

// Controla os PDFs enviados durante a edição de um formulário, para não deixar lixo:
// cancelar apaga os novos; salvar apaga os que ficaram sem uso (inclusive o antigo substituído).
function usePdfSession(originalId) {
  const ids = React.useRef([]);
  return {
    track(newId, currentId) {
      if (currentId && ids.current.includes(currentId)) {
        deleteArquivo(currentId);
        ids.current = ids.current.filter(x => x !== currentId);
      }
      ids.current.push(newId);
    },
    afterSave(savedId) {
      ids.current.filter(x => x !== savedId).forEach(deleteArquivo);
      if (originalId && originalId !== savedId) deleteArquivo(originalId);
      ids.current = [];
    },
    cancel() { ids.current.forEach(deleteArquivo); ids.current = []; },
    afterRemove() {
      ids.current.forEach(deleteArquivo);
      if (originalId) deleteArquivo(originalId);
      ids.current = [];
    },
  };
}

/* ── Soltar PDFs direto na aba ────────────── */
const TAB_LABEL = {empresa:'Empresa', certidoes:'Certidões', documentos:'Documentos', licencas:'Licenças'};

async function findExisting(tab, nome) {
  const snap = await db.collection(tab).get();
  if (tab === 'empresa') return snap.docs[0] || null;
  const alvo = (nome || '').trim().toLowerCase();
  return snap.docs.find(d => ((d.data().nome) || '').trim().toLowerCase() === alvo) || null;
}

function SmartDrop({currentTab}) {
  const [hot, setHot] = useState(false);
  const [busy, setBusy] = useState(false);
  const [saving, setSaving] = useState(false);
  const [entries, setEntries] = useState([]);
  const [msg, setMsg] = useState(null);

  const upd = (key, patch) => setEntries(es => es.map(e => e.key === key ? {...e, ...patch} : e));
  const drop = key => setEntries(es => es.filter(e => e.key !== key));

  async function analyze(fileList) {
    const pdfs = Array.from(fileList || []).filter(f => /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name));
    if (!pdfs.length) { setMsg({ok:false, msg:'Solte arquivos em PDF.'}); return; }
    setBusy(true); setMsg(null);
    const out = [];
    for (const file of pdfs) {
      const e = {key: Math.random().toString(36).slice(2), file, fileName: file.name, extras: null, empresa: null, error: null};
      try {
        if (file.size > MAX_PDF_BYTES) throw friendlyError(`PDF muito grande (${fmtFileSize(file.size)}). Limite: ${fmtFileSize(MAX_PDF_BYTES)}.`);
        let rows = [];
        try { rows = await extractPdfRows(file); } catch (err) { console.error('Falha ao ler PDF', err); }
        const text = rows.map(rowText).join('\n');
        const kind = classifyDoc(text, file.name);
        const info = KIND_INFO[kind];
        e.kind = kind;
        e.known = !!info;
        e.tab = info ? info.tab : (currentTab === 'empresa' ? 'documentos' : currentTab);
        e.nome = info ? info.label : suggestNomeFromFile(file.name);
        if (e.tab === 'empresa') {
          e.empresa = parseCartaoCNPJ(rows);
          if (e.empresa.razaoSocial) e.nome = 'Cartão CNPJ — ' + e.empresa.razaoSocial;
        } else if (e.tab === 'certidoes') {
          const p = info ? parseCertidao(kind, text, file.name) : {
            validade: findDateNearKeywords(text, ['VALIDADE','VÁLIDA ATÉ','VALIDO ATE','VÁLIDO ATÉ','VENCIMENTO']) || dateFromFilename(file.name),
            emissao: findDateNearKeywords(text, ['EMISS','EXPEDI']),
          };
          e.nome = p.nome || e.nome; e.emissao = p.emissao || ''; e.validade = p.validade || ''; e.extras = p.empresa || null;
        } else if (e.tab === 'documentos') {
          const p = info ? parseDocumento(kind, text, file.name) : {};
          e.nome = p.nome || e.nome; e.dataAtualizacao = p.dataAtualizacao || fmtDate(new Date());
          if (kind === 'im') e.extras = parseCartaoMunicipal(text);
        } else if (e.tab === 'licencas') {
          e.orgao = guessOrgao(text) || '';
          e.validade = findDateNearKeywords(text, ['VALIDADE','VÁLIDA ATÉ','VALIDO ATE','VÁLIDO ATÉ','VENCIMENTO']) || dateFromFilename(file.name) || '';
        }
        const ex = await findExisting(e.tab, e.nome);
        e.matchId = ex ? ex.id : null;
      } catch (err) {
        console.error(err);
        e.error = err && err.friendly ? err.message : 'Não foi possível ler este arquivo.';
      }
      out.push(e);
    }
    setEntries(es => [...es, ...out]);
    setBusy(false);
  }

  async function saveAll() {
    setSaving(true); setMsg(null);
    const extras = {};
    let ok = 0, fail = 0;
    for (const e of entries) {
      if (e.error) { fail++; continue; }
      let newPdf = null;
      try {
        newPdf = await uploadPdfToStorage(e.file, e.tab);
        const pdf = {pdfId: newPdf.id, pdfNome: newPdf.nome};
        const ex = await findExisting(e.tab, e.nome);
        const oldPdf = ex ? ex.data().pdfId : null;
        const ts = firebase.firestore.FieldValue.serverTimestamp();
        let data;
        if (e.tab === 'empresa') {
          data = {...e.empresa, ...pdf};
          if (ex) await db.collection('empresa').doc(ex.id).update(data);
          else {
            if (!data.razaoSocial) throw friendlyError('Não encontrei a razão social neste PDF.');
            await db.collection('empresa').add({...data, criadoEm: ts});
          }
        } else {
          if (e.tab === 'certidoes') data = {nome: e.nome.trim(), emissao: (e.emissao||'').trim(), validade: (e.validade||'').trim(), ...pdf};
          else if (e.tab === 'documentos') data = {nome: e.nome.trim(), tipo:'pdf', formato:'PDF', tamanho: fmtFileSize(e.file.size), dataAtualizacao: (e.dataAtualizacao||'').trim(), ...pdf};
          else data = {nome: e.nome.trim(), orgao: (e.orgao||'').trim(), validade: (e.validade||'').trim(), ...pdf};
          if (ex) await db.collection(e.tab).doc(ex.id).update(data);
          else await db.collection(e.tab).add({...data, criadoEm: ts});
        }
        if (oldPdf && oldPdf !== newPdf.id) deleteArquivo(oldPdf);
        if (e.extras) Object.assign(extras, e.extras);
        ok++;
      } catch (err) {
        console.error(err);
        if (newPdf) deleteArquivo(newPdf.id);
        e.error = err && err.friendly ? err.message : 'Erro ao salvar este arquivo.';
        fail++;
      }
    }
    // Inscrição Estadual / Municipal encontradas nas certidões vão para a aba Empresa
    let extraNote = '';
    if (ok && Object.keys(extras).length) {
      try {
        const emp = await findExisting('empresa');
        if (emp) { await db.collection('empresa').doc(emp.id).update(extras); extraNote = ' Inscrições atualizadas na aba Empresa.'; }
      } catch (err) { console.error(err); }
    }
    setEntries(es => es.filter(e => e.error));
    setSaving(false);
    setMsg(fail
      ? {ok:false, msg:`${ok} salvo(s), ${fail} com problema (veja abaixo).${extraNote}`}
      : {ok:true, msg:`${ok} arquivo(s) salvo(s).${extraNote}`});
  }

  const tabOpts = [['certidoes','Certidão'],['documentos','Documento'],['licencas','Licença']];

  return (
    <>
      <div
        className={`sd-drop${hot ? ' hot' : ''}`}
        onDragOver={e => { e.preventDefault(); setHot(true); }}
        onDragLeave={() => setHot(false)}
        onDrop={e => { e.preventDefault(); setHot(false); analyze(e.dataTransfer.files); }}
      >
        <div className="sd-ico"><Icon name="upload"/></div>
        <div className="sd-t">
          <strong>{busy ? 'Lendo os PDFs…' : 'Solte aqui os PDFs — pode ser vários de uma vez'}</strong>
          <span>O sistema reconhece o tipo (CNPJ, CND Federal, FGTS, Trabalhista, Estadual, Municipal, Falência…) e preenche sozinho. Você confere antes de salvar.</span>
        </div>
        <label className="btn sm" style={{cursor:'pointer'}}>
          <Icon name="file"/> Selecionar PDFs
          <input type="file" accept="application/pdf" multiple style={{display:'none'}} disabled={busy || saving}
            onChange={e => { const fs = e.target.files; analyze(fs); e.target.value = ''; }}/>
        </label>
      </div>
      {msg && <p className={`pdf-note ${msg.ok ? 'ok' : 'warn'}`} style={{marginBottom:12}}>{msg.msg}</p>}

      {entries.length > 0 && (
        <div className="card">
          <div className="card-h">
            <h2>Revisar antes de salvar · {entries.length} arquivo{entries.length > 1 ? 's' : ''}</h2>
            <span className="sd-tip">Nada é gravado até você confirmar</span>
          </div>
          {entries.map(e => (
            <div className="sd-rev" key={e.key}>
              <div className="sd-rev-h">
                <div className="sd-pdfi"><Icon name="file"/></div>
                <div className="sd-n"><b>{e.error ? e.fileName : (e.tab === 'empresa' ? 'Cartão CNPJ' : e.nome)}</b>{e.fileName}</div>
                {e.error ? <span className="sd-chip warn">{e.error}</span> : (
                  <>
                    {!e.known && <span className="sd-chip warn">Tipo não reconhecido</span>}
                    <span className={`sd-chip ${e.matchId ? 'warn' : 'blue'}`}>
                      {e.tab === 'empresa' ? 'Atualiza a Empresa' : (e.matchId ? 'Substitui a anterior' : 'Nova')} · {TAB_LABEL[e.tab]}
                    </span>
                  </>
                )}
                <button className="x" title="Remover da lista" onClick={() => drop(e.key)}><Icon name="x"/></button>
              </div>
              {!e.error && e.tab === 'empresa' && (
                <p className="sd-tip" style={{margin:0}}>
                  Vai preencher: {Object.keys(e.empresa).filter(k => k !== 'atividadesSecundarias').length} campos
                  {e.empresa.atividadesSecundarias ? ` + ${e.empresa.atividadesSecundarias.split('\n').length} atividades secundárias` : ''}
                  {e.empresa.razaoSocial ? ` (${e.empresa.razaoSocial})` : ''}.
                </p>
              )}
              {!e.error && e.tab !== 'empresa' && (
                <div className="sd-fields">
                  {!e.known && (
                    <div><label>Guardar em</label>
                      <select className="inp" value={e.tab} onChange={ev => upd(e.key, {tab: ev.target.value})}>
                        {tabOpts.map(([v,l]) => <option key={v} value={v}>{l}</option>)}
                      </select>
                    </div>
                  )}
                  <div style={{gridColumn: '1 / -1'}}><label>Nome</label><input className="inp" value={e.nome} onChange={ev => upd(e.key, {nome: ev.target.value})}/></div>
                  {e.tab === 'certidoes' && <><div><label>Emissão</label><input className="inp" value={e.emissao || ''} onChange={ev => upd(e.key, {emissao: ev.target.value})} placeholder="dd/mm/aaaa"/></div>
                    <div><label>Validade</label><input className="inp" value={e.validade || ''} onChange={ev => upd(e.key, {validade: ev.target.value})} placeholder="dd/mm/aaaa"/></div></>}
                  {e.tab === 'licencas' && <><div><label>Órgão</label><input className="inp" value={e.orgao || ''} onChange={ev => upd(e.key, {orgao: ev.target.value})}/></div>
                    <div><label>Validade</label><input className="inp" value={e.validade || ''} onChange={ev => upd(e.key, {validade: ev.target.value})} placeholder="dd/mm/aaaa"/></div></>}
                  {e.tab === 'documentos' && <div><label>Data de atualização</label><input className="inp" value={e.dataAtualizacao || ''} onChange={ev => upd(e.key, {dataAtualizacao: ev.target.value})}/></div>}
                </div>
              )}
              {!e.error && e.extras && (e.extras.ie || e.extras.im) && (
                <p className="sd-tip" style={{margin:0}}>Também encontrei {e.extras.ie ? `a Inscrição Estadual ${e.extras.ie}` : `a Inscrição Municipal ${e.extras.im}`} — será preenchida na aba Empresa.</p>
              )}
              {!e.error && e.kind === 'ie' && <p className="sd-tip" style={{margin:0}}>Este PDF é imagem: o tipo e a validade vieram do nome do arquivo. Confira a validade.</p>}
              {!e.error && e.kind === 'balanco' && <p className="sd-tip" style={{margin:0}}>PDF digitalizado (imagem): só o nome foi reconhecido.</p>}
            </div>
          ))}
          <div className="sd-bar">
            <span className="sd-tip">PDFs antigos substituídos são apagados automaticamente.</span>
            <div style={{display:'flex',gap:8}}>
              <button className="btn" disabled={saving} onClick={() => setEntries([])}>Cancelar</button>
              <button className="btn primary" disabled={saving || !entries.some(e => !e.error)} onClick={saveAll}>{saving ? 'Salvando…' : `Salvar tudo (${entries.filter(e => !e.error).length})`}</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

  let cur = r.getAttribute('data-theme');
  if(!cur) cur = (window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches) ? 'dark' : 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  r.setAttribute('data-theme', next);

/* ── useCollection hook ──────────────────── */
function useCollection(name) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    if (!db) return;
    const unsub = db.collection(name).onSnapshot(snap => {
      setItems(snap.docs.map(d => ({id:d.id, ...d.data()})));
      setLoading(false);
    }, () => setLoading(false));
    return unsub;
  }, [name]);
  return {items, loading};
}

function CertidaoForm({data, onClose}) {
  const isEdit = !!(data && data.id);
  const empty = {nome:'', emissao:'', validade:'', pdfId:'', pdfNome:''};
  const [form, setForm] = useState(data ? {...empty,...data} : empty);
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');
  const set = (k,v) => setForm(f => ({...f,[k]:v}));
  const pdf = usePdfSession(data && data.pdfId);
  const close = () => { pdf.cancel(); onClose(); };

  function handlePdfResult({uploaded, text}) {
    pdf.track(uploaded.id, form.pdfId);
    const nomeGuess = !form.nome.trim() ? guessCertidaoNome(text) : null;
    const validadeGuess = findDateNearKeywords(text, ['VALIDADE','VÁLIDA ATÉ','VALIDO ATE','VÁLIDO ATÉ','VENCIMENTO']);
    const emissaoGuess = findDateNearKeywords(text, ['EMISS', 'EXPEDI', 'DATA DE EMISSÃO']);
    const dates = findAllDates(text);
    setForm(f => ({
      ...f,
      nome: f.nome.trim() || nomeGuess || f.nome,
      validade: f.validade || validadeGuess || (dates.length ? dates[dates.length-1] : f.validade),
      emissao: f.emissao || emissaoGuess || (dates.length ? dates[0] : f.emissao),
      pdfId: uploaded.id,
      pdfNome: uploaded.nome,
    }));
  }

  async function save() {
    if (!form.nome.trim()) {setErr('Informe o nome da certidão.'); return;}
    setErr(''); setSaving(true);
    try {
      const d = {nome:form.nome.trim(), emissao:(form.emissao||'').trim(), validade:(form.validade||'').trim(), pdfId:form.pdfId||'', pdfNome:form.pdfNome||''};
      if (isEdit) await db.collection('certidoes').doc(data.id).update(d);
      else { d.criadoEm = firebase.firestore.FieldValue.serverTimestamp(); await db.collection('certidoes').add(d); }
      pdf.afterSave(d.pdfId);
      onClose();
    } catch(e) { console.error(e); setErr('Erro ao salvar.'); } finally { setSaving(false); }
  }

  async function remove() {
    if (!window.confirm('Excluir esta certidão?')) return;
    setSaving(true);
    try { await db.collection('certidoes').doc(data.id).delete(); pdf.afterRemove(); onClose(); }
    catch(e) { console.error(e); setErr('Erro ao excluir.'); setSaving(false); }
  }

  return (
    <Dialog title={isEdit ? 'Editar Certidão' : 'Nova Certidão'} onClose={close} onSave={save} onDelete={isEdit ? remove : null} saving={saving} err={err}>
      <div className="form">
        <PdfDropZone folder="certidoes" label="Importar certidão em PDF" onResult={handlePdfResult} />

        <div className="row2">
          <div className="f"><label>Emissão (dd/mm/aaaa)</label><input className="inp" value={form.emissao} onChange={e=>set('emissao',e.target.value)} placeholder="15/04/2026"/></div>

                        {l.pdfId && <a className="pdf-view-btn" href="#" onClick={e=>openPdf(e, l.pdfId)} title="Ver PDF"><Icon name="file" className="ic" style={{width:14,height:14}}/></a>}
                        <button className="btn sm" onClick={() => {setEditItem(l); setShowForm(true);}}><Icon name="edit" className="ic" style={{width:13,height:13}}/></button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
      {showForm && <LicencaForm data={editItem} onClose={() => setShowForm(false)} />}
    </>
  );
}

function LicencaForm({data, onClose}) {
  const isEdit = !!(data && data.id);
  const empty = {nome:'', orgao:'', validade:'', pdfId:'', pdfNome:''};
  const [form, setForm] = useState(data ? {...empty,...data} : empty);
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');
  const set = (k,v) => setForm(f => ({...f,[k]:v}));
  const pdf = usePdfSession(data && data.pdfId);
  const close = () => { pdf.cancel(); onClose(); };

  function handlePdfResult({file, uploaded, text}) {
    pdf.track(uploaded.id, form.pdfId);
    const orgaoGuess = !form.orgao.trim() ? guessOrgao(text) : null;
    const validadeGuess = findDateNearKeywords(text, ['VALIDADE','VÁLIDA ATÉ','VALIDO ATE','VÁLIDO ATÉ','VENCIMENTO']);
    const dates = findAllDates(text);
    setForm(f => ({
      ...f,
      nome: f.nome.trim() || suggestNomeFromFile(file.name),
      orgao: f.orgao || orgaoGuess || f.orgao,
      validade: f.validade || validadeGuess || (dates.length ? dates[dates.length-1] : f.validade),
      pdfId: uploaded.id,
      pdfNome: uploaded.nome,
    }));
  }

  async function save() {
    if (!form.nome.trim()) {setErr('Informe o nome da licença.'); return;}
    setErr(''); setSaving(true);
    try {
      const d = {nome:form.nome.trim(), orgao:(form.orgao||'').trim(), validade:(form.validade||'').trim(), pdfId:form.pdfId||'', pdfNome:form.pdfNome||''};
      if (isEdit) await db.collection('licencas').doc(data.id).update(d);
      else { d.criadoEm = firebase.firestore.FieldValue.serverTimestamp(); await db.collection('licencas').add(d); }
      pdf.afterSave(d.pdfId);
      onClose();
    } catch(e) { console.error(e); setErr('Erro ao salvar.'); } finally { setSaving(false); }
  }

  async function remove() {
    if (!window.confirm('Excluir esta licença?')) return;
    setSaving(true);
    try { await db.collection('licencas').doc(data.id).delete(); pdf.afterRemove(); onClose(); }
    catch(e) { console.error(e); setErr('Erro ao excluir.'); setSaving(false); }
  }

  return (
    <Dialog title={isEdit ? 'Editar Licença' : 'Nova Licença'} onClose={close} onSave={save} onDelete={isEdit ? remove : null} saving={saving} err={err}>
      <div className="form">
        <PdfDropZone folder="licencas" label="Arraste a licença/alvará em PDF" onResult={handlePdfResult} />
        {form.pdfId && <a className="pdf-link" href="#" onClick={e=>openPdf(e, form.pdfId)}><Icon name="file" className="ic" style={{width:13,height:13}}/> {form.pdfNome || 'Ver PDF anexado'}</a>}
        <div className="f"><label>Nome da Licença / Alvará *</label><input className="inp" value={form.nome} onChange={e=>set('nome',e.target.value)} placeholder="Ex: Alvará de Funcionamento"/></div>
        <div className="row2">
          <div className="f"><label>Órgão</label><input className="inp" value={form.orgao} onChange={e=>set('orgao',e.target.value)} placeholder="Ex: Prefeitura de Manaus"/></div>
          <div className="f"><label>Validade (dd/mm/aaaa)</label><input className="inp" value={form.validade} onChange={e=>set('validade',e.target.value)} placeholder="31/12/2026"/></div>
        </div>
        <p style={{margin:0,fontSize:12,color:'var(--muted)'}}>Dica: reveja órgão e validade antes de salvar — a leitura automática é uma sugestão.</p>
      </div>
    </Dialog>
  );
}

/* ── PATRIMÔNIO TAB ──────────────────────── */
function PatrimonioTab() {
  const {items, loading} = useCollection('patrimonio');
  const [editItem, setEditItem] = useState(null);
  const [showForm, setShowForm] = useState(false);

  if (loading) return <div className="loading">Carregando…</div>;

  const total = items.reduce((s,p) => s + Number(p.valor||0), 0);

  return (
    <>
      <div className="card">
        <div className="card-h">
          <h2><Icon name="box"/> Patrimônio</h2>
          <button className="btn primary" onClick={() => {setEditItem(null); setShowForm(true);}}><Icon name="plus"/> Novo Item</button>
        </div>
        {items.length === 0 ? <div className="empty">Nenhum item de patrimônio cadastrado.</div> : (
          <div className="pat-grid">
            {items.map(p => (
              <div className="pat-card" key={p.id} style={{cursor:'pointer'}} onClick={() => {setEditItem(p); setShowForm(true);}}>
                <h4>{p.nome}</h4>
                <div className="pat-meta">
                  {p.detalhes && <span>{p.detalhes}</span>}
                  {(p.placa || p.aquisicao) && <span>{[p.placa && `Placa: ${p.placa}`, p.aquisicao && `Aquisição: ${p.aquisicao}`].filter(Boolean).join(' · ')}</span>}
                </div>
                <div className="pat-val">{fmtBRL(p.valor)}</div>
                {p.pdfId && <a className="pdf-link" style={{marginTop:8}} href="#" onClick={e=>openPdf(e, p.pdfId)}><Icon name="file" className="ic" style={{width:12,height:12}}/> {p.pdfNome || 'Nota fiscal'}</a>}
              </div>
            ))}
          </div>
        )}
      </div>
      {showForm && <PatrimonioForm data={editItem} onClose={() => setShowForm(false)} />}
    </>
  );
}

function PatrimonioForm({data, onClose}) {
  const isEdit = !!(data && data.id);
  const empty = {nome:'', detalhes:'', placa:'', aquisicao:'', valor:'', pdfId:'', pdfNome:''};
  const [form, setForm] = useState(data ? {...empty,...data, valor: String(data.valor||'')} : empty);
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');
  const set = (k,v) => setForm(f => ({...f,[k]:v}));
  const pdf = usePdfSession(data && data.pdfId);
  const close = () => { pdf.cancel(); onClose(); };

  function handlePdfResult({file, uploaded}) {
    pdf.track(uploaded.id, form.pdfId);
    setForm(f => ({...f, nome: f.nome.trim() || suggestNomeFromFile(file.name), pdfId: uploaded.id, pdfNome: uploaded.nome}));
  }

  async function save() {
    if (!form.nome.trim()) {setErr('Informe o nome do item.'); return;}
    setErr(''); setSaving(true);
    try {
      const d = {nome:form.nome.trim(), detalhes:(form.detalhes||'').trim(), placa:(form.placa||'').trim(), aquisicao:(form.aquisicao||'').trim(), valor:Number(form.valor)||0, pdfId:form.pdfId||'', pdfNome:form.pdfNome||''};
      if (isEdit) await db.collection('patrimonio').doc(data.id).update(d);
      else { d.criadoEm = firebase.firestore.FieldValue.serverTimestamp(); await db.collection('patrimonio').add(d); }
      pdf.afterSave(d.pdfId);
      onClose();
    } catch(e) { console.error(e); setErr('Erro ao salvar.'); } finally { setSaving(false); }
  }

  async function remove() {
    if (!window.confirm('Excluir este item?')) return;
    setSaving(true);
    try { await db.collection('patrimonio').doc(data.id).delete(); pdf.afterRemove(); onClose(); }
    catch(e) { console.error(e); setErr('Erro ao excluir.'); setSaving(false); }
  }

  return (
    <Dialog title={isEdit ? 'Editar Item' : 'Novo Item'} onClose={close} onSave={save} onDelete={isEdit ? remove : null} saving={saving} err={err}>
      <div className="form">
        <PdfDropZone folder="patrimonio" label="Anexar nota fiscal / comprovante (PDF)" onResult={handlePdfResult} />
        {form.pdfId && <a className="pdf-link" href="#" onClick={e=>openPdf(e, form.pdfId)}><Icon name="file" className="ic" style={{width:13,height:13}}/> {form.pdfNome || 'Ver PDF anexado'}</a>}
        <div className="f"><label>Nome / Descrição *</label><input className="inp" value={form.nome} onChange={e=>set('nome',e.target.value)} placeholder="Ex: Impressora UV Flatbed"/></div>
        <div className="f"><label>Detalhes (marca, modelo)</label><input className="inp" value={form.detalhes} onChange={e=>set('detalhes',e.target.value)} placeholder="Ex: Roland · LEJ-640FT"/></div>
        <div className="row2">
          <div className="f"><label>Placa / Identificação</label><input className="inp" value={form.placa} onChange={e=>set('placa',e.target.value)} placeholder="#001"/></div>
          <div className="f"><label>Aquisição</label><input className="inp" value={form.aquisicao} onChange={e=>set('aquisicao',e.target.value)} placeholder="03/2023"/></div>
        </div>
        <div className="f"><label>Valor (R$)</label><input className="inp" type="number" value={form.valor} onChange={e=>set('valor',e.target.value)} placeholder="85000"/></div>
      </div>
    </Dialog>
  );
}

/* ── APP ─────────────────────────────────── */
const TABS = [
  {key:'empresa', label:'Empresa', icon:'building'},
  {key:'certidoes', label:'Certidões', icon:'shield'},
  {key:'documentos', label:'Documentos', icon:'file'},
  {key:'licencas', label:'Licenças', icon:'key'},
  {key:'patrimonio', label:'Patrimônio', icon:'box'},
];

function App() {
  const [tab, setTab] = useState('empresa');
  const certidoes = useCollection('certidoes');
  const documentos = useCollection('documentos');
  const patrimonio = useCollection('patrimonio');

  const certValidas = certidoes.items.filter(c => certStatus(c.validade).cls === 'ok').length;
  const certTotal = certidoes.items.length;
  const certVencendo = certidoes.items.filter(c => certStatus(c.validade).cls === 'warn');
  const patTotal = patrimonio.items.reduce((s,p) => s + Number(p.valor||0), 0);

  return (
    <>
      <Header />
      <main className="wrap">
        <a href={PAINEL_URL} className="back"><Icon name="back"/> Voltar ao Painel</a>
        <div className="page-h">
          <h1>Administrativo</h1>
          <p>Dados da empresa, certidões, documentos e patrimônio.</p>
        </div>

        <div className="summary-row">
          <div className="summary-card">
            <div className="label">Certidões</div>
            <div className="value" style={{color: certTotal > 0 && certValidas === certTotal ? 'var(--ok)' : certTotal > 0 ? 'var(--warn)' : 'var(--ink)'}}>
              {certTotal > 0 ? `${certValidas}/${certTotal} válidas` : '—'}
            </div>
          </div>
          <div className="summary-card">
            <div className="label">Vencendo em 60 dias</div>
            <div className="value" style={{color: certVencendo.length > 0 ? 'var(--warn)' : 'var(--ok)'}}>
              {certVencendo.length}
            </div>
            {certVencendo.length > 0 && <div className="sub">{certVencendo.map(c => c.nome).join(', ')}</div>}
          </div>
          <div className="summary-card">
            <div className="label">Documentos</div>
            <div className="value">{documentos.items.length}</div>
          </div>
          <div className="summary-card">
            <div className="label">Patrimônio</div>
            <div className="value">{patTotal > 0 ? fmtBRL(patTotal) : '—'}</div>
          </div>
        </div>

        <div className="tabs">
          {TABS.map(t => (
            <button key={t.key} className={`tab${tab===t.key?' active':''}`} onClick={() => setTab(t.key)}>
              <Icon name={t.icon} style={{width:14,height:14,marginRight:6,verticalAlign:'middle'}}/> {t.label}
            </button>
          ))}
        </div>

        {tab === 'empresa' && <EmpresaTab />}
        {tab === 'certidoes' && <CertidoesTab />}
        {tab === 'documentos' && <DocumentosTab />}
        {tab === 'licencas' && <LicencasTab />}
        {tab === 'patrimonio' && <PatrimonioTab />}
      </main>
    </>
  );
}

(function(){try{var t=localStorage.getItem('novari-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
ReactDOM.createRoot(document.getElementById('root')).render(<AuthGate><App /></AuthGate>);
</script>
